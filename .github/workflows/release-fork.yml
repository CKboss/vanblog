name: release

# 本 fork 的发版流程。
#
# ⚠️ 上游的 .github/workflows/release.yml 已删除，**不要加回来**：它同样由 `v*` tag 触发，
# 但做的是作者自己的事 —— 登录 DockerHub 推 `mereith/van-blog:<版本>` 与 `:latest`、
# `curl -X POST $VERSIONURL`（往作者的版本服务器上报版本）、
# 还有两步 `kubectl set image deployment/van-blog …`（**部署到作者的集群**）。
# 在 fork 里这些步骤要么因为缺 secret 失败、要么就是往别人家推东西，都不该跑。
# 镜像发布由 publish-ghcr.yml 负责（同样由 `v*` tag 触发，推到本仓库的 ghcr）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布/重建 Release 的 tag（例如 v2026.09）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # ⚠️ 第三方 action 一律钉到 commit sha，不用可变标签：标签能被上游移动、账号能被接管，
        #    而这些 job 持有写权限（packages/contents）⇒ 那等于把"往 ghcr 推镜像 / 往 Release 挂
        #    vanblog.sh"的能力交出去，而文档正叫用户 `curl … | sh` 以 root 执行那个附件。
        #    sha ↔ 标签的对应写在行尾注释里，升级时重新解析一次即可。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: 确定 tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ -z "${tag}" ]; then
            echo "::error::拿不到 tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "发布 tag：${tag}"

      # 发布说明直接取 CHANGELOG.md 里对应 tag 的那一节（人工写好的，比自动生成的提交列表有用）。
      # 找不到就退回 [Unreleased] 一节，再找不到就用自动生成的提交列表。
      # 🔴 这一步的逻辑在仓库里（`scripts/releaseNotes.py`），守卫是 `scripts/tests/release-notes.test.sh`
      #    （由 server-test.yml 跑）。⚠️ 这句指针**刻意写在 YAML 注释里、不写进下面的 run 块**：
      #    run 块里的 `#` 行仍然是 run 字符串的一部分，`ci-paths-coverage` 会据此认为
      #    "本 workflow 也跑那条守卫"⇒ 反过来要求**本文件**的 paths 覆盖守卫读到的每个文件
      #    （实测就是这么报出 4 处 MISSING 的）。👉 在 workflow 里提到别的守卫时，写在 YAML 注释里。
      - name: 从 CHANGELOG 提取发布说明
        id: notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # 🔴 2026-10-06：原来这里是一段**内联 python heredoc**。搬进仓库（`scripts/releaseNotes.py`）有两个理由：
          #    ① 内联在 workflow 里的逻辑**本机跑不了**⇒ 只有发版那天才知道它坏没坏（而发版失败是要重来一次的）；
          #    ② 🔴 它缺一段**必需**的逻辑：当前 `[Unreleased]` 一节实测 **126,276 字符 / 241 KB**（47 个批次），
          #       而 GitHub 对 Release 正文有长度上限（业界常引用 124,000 字符；本机取不到 docs.github.com 核实
          #       ⇒ 脚本里取**保守值 100,000**）⇒ 照原样发，创建 Release 那一步很可能被 API 拒（422），
          #       或者发出去是一篇 24 万字节的"发布说明"。脚本会在超限时压成"每批一段摘要 + 完整 CHANGELOG 链接"，
          #       一个字都不丢（完整记录仍在仓库与文档站）。
          python3 scripts/releaseNotes.py "${tag}" "${GITHUB_REPOSITORY}" > RELEASE_BODY.md
          lines=$(wc -l < RELEASE_BODY.md)
          echo "发布说明 ${lines} 行"
          head -5 RELEASE_BODY.md

      - name: 附上发布说明里的镜像信息
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo
            echo "---"
            echo
            echo "## 镜像"
            echo
            echo "本 tag 会同时触发 \`publish-ghcr\` 构建并推送镜像："
            echo
            echo '```'
            echo "ghcr.io/${repo_lc}:latest"
            echo "ghcr.io/${repo_lc}:${tag}"
            echo '```'
            echo
            echo "一键脚本（也可以直接从本 Release 的附件下载 \`vanblog.sh\`）："
            echo
            echo '```bash'
            echo "curl -L https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/scripts/vanblog.sh -o vanblog.sh && chmod +x vanblog.sh && ./vanblog.sh"
            echo '```'
            echo
            echo "换机器搬站（装完自动从整站备份恢复）："
            echo
            echo '```bash'
            echo "VANBLOG_RESTORE_FROM=/path/to/vanblog-full-xxx.tar.zst ./vanblog.sh install"
            echo '```'
          } >> RELEASE_BODY.md

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            scripts/vanblog.sh
            docker-compose/docker-compose-template.yml

      - name: 打印结果
        run: |
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.tag.outputs.tag }}"
          echo "镜像构建：Actions → publish-ghcr（同一个 tag 触发）"
