name: server-test

on:
  push:
    branches:
      - dev/dsh
    # 只改文档时不用跑测试（文档站有自己的构建检查）
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    branches:
      - master
      - dev/dsh
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'

# 同一个分支上连着推两次时，把还在跑的那次取消掉：
# 这个 job 要装整个 workspace 的依赖，排队很浪费。
concurrency:
  group: server-test-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ 最小权限：这两个 job 只跑测试、不发布，所以只要 contents: read。不写 permissions: 时
#    push 触发会拿到仓库默认令牌（可能含 write）。触发是 push + pull_request（不是
#    pull_request_target），fork PR 本来就只有只读令牌，所以这条是**收口**而不是补洞 ——
#    写出来是为了将来有人给这两个 workflow 加发布步骤时不会顺手拿到写权限。
permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-22.04
    # 15 分钟不够：要装整个 workspace 的依赖，再跑 8 个 e2e 套件
    timeout-minutes: 30
    steps:
      - name: Checkout
        # ⚠️ 第三方 action 一律钉到 commit sha，不用可变标签：标签能被上游移动、账号能被接管，
        #    而这些 job 持有写权限（packages/contents）⇒ 那等于把"往 ghcr 推镜像 / 往 Release 挂
        #    vanblog.sh"的能力交出去，而文档正叫用户 `curl … | sh` 以 root 执行那个附件。
        #    sha ↔ 标签的对应写在行尾注释里，升级时重新解析一次即可。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # ⚠️ 这里以前直接跑 6 个 shell 守卫（dockerfile-alpine-sharp / vanblog-update /
      #    vanblog-reset-https / vanblog-uninstall / vanblog-download-fallback /
      #    reverse-proxy-host-header）。它们已经搬到下面的 `guards-core` job，理由：
      #    ① 27 个守卫里只有 6 个进过 CI，剩下的靠人记得跑 —— 本轮 `docs-consistency`
      #       抓到过两条真问题（一个不存在的 `VANBLOG_SHUTDOWN_TIMEOUT_MS` 死旋钮、一个新子命令
      #       没写进 `--help`），而它根本不在 CI 里；
      #    ② 分开的 job 与本 job **并行**，守卫的红灯 2 分钟内就能看到，不用等在这个
      #       要装依赖 + 跑 8 套 e2e 的 30 分钟 job 后面；
      #    ③ 守卫需要的前置（zstd）只需在一个地方准备一次。
      #    `vanblog-backup-encryption` 是例外，它留在本 job —— 它要 `packages/server/dist`
      #    里编译好的 `backupCrypto.js` 才能跑真加密用例（见下面 build 之后那一步）。

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b  # 分支 v2（该仓库没有 v2 这个 tag，@v2 解析到的是可移动分支）
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── 类型检查 ─────────────────────────────────────────────────────────────
      # ⚠️ 为什么是这一步、为什么是这两份配置：本仓库**从来没有在 CI 里做过任何类型检查**
      #    （4 个 workflow 里 grep `tsc`/`tsconfig` 是 0 命中）。后果本轮被证实：
      #    `TS6304: Composite projects may not disable declaration emit` 一路走到镜像构建才爆。
      #
      # ⚠️ 更正一条会被误传的说法：`--noEmit` **能**看到 TS6304
      #    （实测 `tsc -p tsconfig.build.json --noEmit --declaration false` 就报它）。
      #    那次之所以漏掉，是因为**只检查了其中一份配置**：`tsconfig.json` 覆盖 473 个 src 文件、
      #    含 **227 个 spec**；`tsconfig.build.json` 覆盖 245 个、**一个 spec 都不含**
      #    （= 镜像里 `nest build` 的真实形状）。两份互补，所以都要跑。
      #
      # ⚠️ 本机的 `packages/server/tsconfig.dev.json` **没有入库**（它在本机 .git/info/exclude 里，
      #    只是为了绕开家目录里的 @types/bun），所以 CI 里**不能**用它 —— 写了就是"文件不存在"。
      #
      # ⚠️ 不要在 CI 里加 `--strict`：`tsconfig.base.json` 显式写着
      #    `strictNullChecks:false`、`noImplicitAny:false`、`strictBindCallApply:false`，
      #    而**配置里的显式 false 会压过命令行的伞形开关** —— 实测 `--strict` 只报 **6** 个错，
      #    而把各开关逐项列出来是 **380** 个。加 `--strict` 会制造"我们已经很严格了"的假象。
      #    逐步收紧是另一件事（要先把那 380 个清掉），不要用它假装完成。
      - name: Typecheck server (repo config — includes 227 spec files)
        working-directory: packages/server
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit --tsBuildInfoFile "${{ runner.temp }}/server-root.tsbuildinfo"

      - name: Typecheck server (build config — the shape the image actually compiles)
        working-directory: packages/server
        run: ./node_modules/.bin/tsc -p tsconfig.build.json --noEmit --tsBuildInfoFile "${{ runner.temp }}/server-build.tsbuildinfo"

      - name: Typecheck website
        working-directory: packages/website
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      # ⚠️ admin 的类型检查**故意不加**：`tsc --noEmit -p packages/admin/tsconfig.json`
      #    当前有 **115 个错**（umi 3 + antd 4 + React 17 的历史包袱）。加进来等于给每个 PR
      #    挂一盏常红灯，而常红灯训练出来的习惯是"忽略红" —— 那比没有检查更糟。
      #    要加就得先清零，那是独立的一件事。

      # ── 真实构建 ─────────────────────────────────────────────────────────────
      # `--noEmit` 看不到"只在真正产出文件时才发生"的失败（输出目录冲突、声明文件产出、
      # 打包期的路径解析）。镜像里跑的就是 `nest build`，所以这里也跑它 ——
      # 顺便产出 `dist/`，让下面那个需要编译产物的守卫能跑**完整**用例而不是跳过。
      - name: Build server (the exact command the image runs)
        working-directory: packages/server
        run: pnpm run build

      - name: Run backup encryption / passphrase / rotate-jwt tests (needs dist for the real-crypto cases)
        # ⚠️ 这个守卫会探测 `tar zstd sha256sum curl node`，缺任何一个就 `passed=0 failed=1`
        #    硬失败；而**真加密**用例还要求 `packages/server/dist/src/utils/backupCrypto.js`
        #    存在，缺了它会 `note` 跳过并仍然"通过" —— 那就是一个只验证了假设的绿灯。
        #    所以下面断言 `note=0`：静默降级成跳过必须算失败。
        run: |
          set -uo pipefail
          # ⚠️ 不用 `tee /dev/stderr`：那个路径在有些环境里不是设备（实测本机报
          #    "No such device or address"），而它在 GitHub runner 上恰好可用 —— 这种
          #    "换个环境就失败"的写法不该进 CI。改成先整体捕获、再原样打印。
          out="$(bash scripts/tests/vanblog-backup-encryption.test.sh 2>&1)"
          printf '%s\n' "${out}" | tail -60
          line="$(printf '%s\n' "${out}" | grep -E '^passed=' | tail -1)"
          [ -n "${line}" ] || { echo "::error::守卫没有输出 passed= 行（脚本本身崩了？）"; exit 1; }
          printf '%s\n' "${line}" | grep -q 'failed=0' || { echo "::error::加密备份守卫有失败项：${line}"; exit 1; }
          printf '%s\n' "${line}" | grep -q 'note=0' || { echo "::error::加密备份守卫 note>0 ⇒ 真加密用例被跳过（dist 里没有 backupCrypto.js？），这不是有效绿灯：${line}"; exit 1; }

      - name: Run vanblog.sh restore tests (needs node_modules for the js-sha256 cross-check)
        # ⚠️ 这个守卫会去找 `node_modules/.pnpm/js-sha256@*`，用它交叉验证
        #    `vanblog.sh` 的登录口令派生与后台 `encryptPwd.js` 逐字节一致。
        #    找不到时它**不失败、只是少跑那几条断言** ⇒ 放在没装依赖的 job 里会得到一个
        #    "覆盖面悄悄变小但仍然绿"的结果，所以它必须跟在 Install 之后跑。
        run: bash scripts/tests/vanblog-restore.test.sh

      - name: Run server unit tests
        working-directory: packages/server
        # ⚠️ 这里以前是一条 80 项的 `--testPathPattern` 白名单。2026-09-17 盘点：
        # **src 下 169 个 spec 里有 47 个从来没在 CI 跑过** —— 包括 setupKey / accessPassword /
        # staticGuard / bruteForceIp / artifactReaper / searchIndex / publishAt / revision /
        # migration / health.controller / unlockBruteforce / mdzImport / logRotate / backupVerify
        # 这些安全与备份相关的钉子。白名单的问题是它只会烂：新增 spec 默认不跑，
        # 而且"CI 绿了"会让人以为全都跑过了（本项目已经因此让一条永久红的 e2e 混了 20 次）。
        # 所以改成**默认全跑**，确实不能在 CI 跑的才排除。目前排除清单为空，因为：
        #   - 要真库的 `searchIndex.realdb.spec.ts` 自己默认 `describe.skip`
        #     （要 VANBLOG_SEARCH_REALDB=1 外加 _PORT/_DBPATH 指到一次性库才跑）；
        #   - `test/` 下那些要 mongod 的 e2e 被 jest 的 rootDir=src + testRegex 天然排除，
        #     各有独立的 `test:*-e2e` 命令、独立端口与"拒绝 27017/真实库名"的硬护栏；
        #   - walineMongo / fullBackup / initJwt / audit-hardening-round2 里的 MongoClient 都是假的，
        #     不需要真库（本来就在白名单里、CI 一直是绿的）。
        run: pnpm test -- --passWithNoTests=false

      - name: Run website unit tests
        run: pnpm --filter @vanblog/theme-default exec vitest run

      - name: Run admin editor unit tests
        working-directory: packages/admin
        run: node --test tests/unit/*.test.js

      - name: Run backup restore e2e
        working-directory: packages/server
        run: pnpm test:backup-e2e

      - name: Run post ISR e2e
        working-directory: packages/server
        run: pnpm test:isr-e2e

      - name: Run admin meta e2e
        working-directory: packages/server
        run: pnpm test:admin-meta-e2e

      - name: Run force-login comment e2e
        working-directory: packages/server
        run: pnpm test:force-login-comment-e2e

      - name: Run waline extra options e2e
        working-directory: packages/server
        run: pnpm test:waline-extra-e2e

      - name: Run CDN URL e2e
        working-directory: packages/server
        run: pnpm test:cdn-url-e2e

      - name: Run word count e2e
        working-directory: packages/server
        run: pnpm test:word-count-e2e

      - name: Run friend link e2e
        working-directory: packages/server
        run: pnpm test:friend-link-e2e

      - name: Run page copy e2e
        working-directory: packages/server
        run: pnpm test:page-copy-e2e

      - name: Run admin cache-control e2e
        working-directory: packages/server
        run: pnpm test:admin-cache-e2e

  # ══════════════════════════════════════════════════════════════════════════
  # 守卫（shell 断言）—— 与 server-test **并行**，不装 workspace 依赖
  # ══════════════════════════════════════════════════════════════════════════
  # 为什么单独一个 job：本仓库有 **27 个** shell 守卫（合计约 2500 条断言），而 CI 里以前只跑
  # **6 个**。剩下 21 个全靠人记得跑，于是本轮真实发生了两次"守卫抓到了问题、但没人跑守卫"：
  #   · `docs-consistency` 抓到一个**不存在的环境变量** `VANBLOG_SHUTDOWN_TIMEOUT_MS`
  #     被写进了面向用户的报错文案（死旋钮），还抓到一个新子命令没写进 `--help`；
  #   · `TS6304: Composite projects may not disable declaration emit` 一路走到**镜像构建**才爆。
  # 这些守卫绝大多数是"用桩替代 docker/compose/curl 的纯逻辑测试"，不需要依赖、不需要引擎，
  # 单个 0.1–7 秒，所以进 PR 档的成本极低（整个 job 约 2 分钟）。
  #
  # ⚠️ 分档判据（写下来，免得下一个人凭感觉挪）：
  #   · **这个 job**：不需要 `node_modules`、不需要 `dist`、不需要容器引擎、不需要 caddy 二进制
  #     （`caddy-perf` 在没有 caddy 时会**优雅跳过** validate 环节 ⇒ 这里跑的是部分覆盖，
  #       完整覆盖在 `nightly.yml` 里装了 caddy 之后跑）。
  #   · **guards-slow**：同样无外部依赖，但单个超过 30 秒，放一起以免拖慢这个 job。
  #   · **server-test job**：需要 `node_modules`（`vanblog-restore` 用 js-sha256 交叉验证口令派生）
  #     或 `dist`（`vanblog-backup-encryption` 用编译好的 `backupCrypto.js` 跑真加密）。
  #     这两个守卫在缺依赖时**不会失败、只会静默少跑断言**，所以必须跟在 Install/Build 之后。
  #   · **nightly.yml**：真需要容器引擎、真 caddy 二进制、真镜像构建、或真归档的
  #     （`vanblog-drill` 的活体部分 `VANBLOG_DRILL_LIVE=1`、`build-image-local.sh` 真构建、
  #       `caddy-perf` 的 validate 环节、`docs:build`）。
  guards-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        # 守卫里有一部分直接调 `node`（生成 caddy 配置、跑假服务器、解析 JSON），
        # 用的是仓库脚本而不是 workspace 代码 ⇒ **不需要 pnpm install**。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Ensure zstd is available
        # ⚠️ `vanblog-verify` 在**没有 zstd 时是硬失败**（实测 `passed=0 failed=1`），
        #    而它并不探测这个工具；`vanblog-backup-encryption` 则会探测并 `exit 1`。
        #    runner 镜像里有没有 zstd 是**不应依赖的假设**，所以缺了就装（有则零成本跳过）。
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            echo "zstd 不在 runner 上，安装它（vanblog-verify 硬依赖）"
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          zstd --version

      - name: Docs internal links
        run: bash scripts/tests/docs-links.test.sh

      - name: Docs ↔ code consistency (env var names, script copies, --help coverage)
        run: bash scripts/tests/docs-consistency.test.sh

      - name: Caddy config generation
        run: bash scripts/tests/caddy-config.test.sh

      - name: Caddy pages-dir cross-language parity (TS resolver vs generator)

        # ⚠️ 同一个环境变量被 TS（服务端三处）与 JS（生成器）两种语言消费时，规则必须逐条对齐。

        # 这条守卫真跑两侧并比对结论（共用一张 32 条取值表 scripts/tests/fixtures/pages-dir-cases.json），

        # 而不是"两边都提到某个关键词"那种空断言。只需 node，不依赖 node_modules/dist/caddy 二进制，

        # 本机 91 条约 25 秒 ⇒ 放 PR 档。

        run: bash scripts/tests/caddy-pages-dir-parity.test.sh

      - name: Caddy performance-related config (validate steps skip without a caddy binary)
        run: bash scripts/tests/caddy-perf.test.sh

      - name: Official Dockerfile Alpine/sharp assertions
        run: bash scripts/tests/dockerfile-alpine-sharp.test.sh

      - name: Dockerfile patch/npmrc assertions
        run: bash scripts/tests/dockerfile-patches.test.sh

      - name: Image runtime (entrypoint, HEALTHCHECK, start.js contract)
        run: bash scripts/tests/image-runtime.test.sh

      - name: start.js process supervision
        run: bash scripts/tests/start-js.test.sh

      - name: build-image-local.sh static contract
        run: bash scripts/tests/build-image-local.test.sh

      - name: Benchmark harness (failure classification, kernel counters, no silent hangs)
        run: bash scripts/tests/benchmark-tool.test.sh

      - name: vanblog.sh hardening assertions
        run: bash scripts/tests/vanblog-hardening.test.sh

      - name: Generated compose health
        run: bash scripts/tests/vanblog-compose-health.test.sh

      - name: vanblog.sh install-cron
        run: bash scripts/tests/vanblog-install-cron.test.sh

      - name: vanblog.sh reset
        run: bash scripts/tests/vanblog-reset.test.sh

      - name: vanblog.sh verify
        run: bash scripts/tests/vanblog-verify.test.sh

      - name: vanblog.sh backup-restore
        run: bash scripts/tests/vanblog-backup-restore.test.sh

      - name: vanblog.sh disaster recovery / offline install
        run: bash scripts/tests/vanblog-dr-offline.test.sh

      - name: waline reset
        run: bash scripts/tests/reset-waline.test.sh

      - name: vanblog.sh update
        run: bash scripts/tests/vanblog-update.test.sh

      - name: vanblog.sh https reset
        run: bash scripts/tests/vanblog-reset-https.test.sh

      - name: vanblog.sh uninstall
        run: bash scripts/tests/vanblog-uninstall.test.sh

      - name: vanblog.sh download fallback
        run: bash scripts/tests/vanblog-download-fallback.test.sh

      - name: Reverse-proxy nginx Host header and cache-bypass docs
        run: bash scripts/tests/reverse-proxy-host-header.test.sh

  # 慢守卫：同样**无外部依赖**，只是单个耗时 30 秒以上，分开跑以免拖慢 guards-core。
  # 两个加起来约 3 分钟（本机实测：drill 148s、source-install 32s）。
  guards-slow:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Ensure zstd is available
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          zstd --version

      - name: Restore drill logic (620 assertions; the live container part stays off)
        # ⚠️ 这个守卫分两部分：A) 纯逻辑，**默认全部跑**（620 条，本机实测 148 秒）；
        #    B) 活体演练，需要引擎 + 镜像 + **一份真归档**，默认跳过并说明原因，
        #    只有 `VANBLOG_DRILL_LIVE=1` 才跑。CI 里跑不了 B —— 归档是站点数据，
        #    不能进仓库，所以那部分永远是"人工在演练机上跑"，不要以为这里覆盖了它。
        run: bash scripts/tests/vanblog-drill.test.sh

      - name: Source-install path (fake git/docker/compose, no network, no daemon)
        run: bash scripts/tests/vanblog-source-install.test.sh
