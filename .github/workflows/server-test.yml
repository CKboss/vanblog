name: server-test

on:
  push:
    branches:
      - dev/dsh
    # 只改文档时不用跑测试（文档站有自己的构建检查）
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    branches:
      - master
      - dev/dsh
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'

# 同一个分支上连着推两次时，把还在跑的那次取消掉：
# 这个 job 要装整个 workspace 的依赖，排队很浪费。
concurrency:
  group: server-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    runs-on: ubuntu-22.04
    # 15 分钟不够：要装整个 workspace 的依赖，再跑 8 个 e2e 套件
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run official Dockerfile Alpine/sharp assertions
        run: bash scripts/tests/dockerfile-alpine-sharp.test.sh

      - name: Run vanblog.sh update tests
        run: bash scripts/tests/vanblog-update.test.sh

      - name: Run vanblog.sh https reset tests
        run: bash scripts/tests/vanblog-reset-https.test.sh

      - name: Run vanblog.sh uninstall tests
        run: bash scripts/tests/vanblog-uninstall.test.sh

      - name: Run vanblog.sh download fallback tests
        run: bash scripts/tests/vanblog-download-fallback.test.sh

      - name: Run reverse-proxy nginx Host header and cache-bypass docs tests
        run: bash scripts/tests/reverse-proxy-host-header.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run server unit tests
        working-directory: packages/server
        # ⚠️ 这里以前是一条 80 项的 `--testPathPattern` 白名单。2026-09-17 盘点：
        # **src 下 169 个 spec 里有 47 个从来没在 CI 跑过** —— 包括 setupKey / accessPassword /
        # staticGuard / bruteForceIp / artifactReaper / searchIndex / publishAt / revision /
        # migration / health.controller / unlockBruteforce / mdzImport / logRotate / backupVerify
        # 这些安全与备份相关的钉子。白名单的问题是它只会烂：新增 spec 默认不跑，
        # 而且"CI 绿了"会让人以为全都跑过了（本项目已经因此让一条永久红的 e2e 混了 20 次）。
        # 所以改成**默认全跑**，确实不能在 CI 跑的才排除。目前排除清单为空，因为：
        #   - 要真库的 `searchIndex.realdb.spec.ts` 自己默认 `describe.skip`
        #     （要 VANBLOG_SEARCH_REALDB_URL 指到一次性库才跑）；
        #   - `test/` 下那些要 mongod 的 e2e 被 jest 的 rootDir=src + testRegex 天然排除，
        #     各有独立的 `test:*-e2e` 命令、独立端口与"拒绝 27017/真实库名"的硬护栏；
        #   - walineMongo / fullBackup / initJwt / audit-hardening-round2 里的 MongoClient 都是假的，
        #     不需要真库（本来就在白名单里、CI 一直是绿的）。
        run: pnpm test -- --passWithNoTests=false

      - name: Run website unit tests
        run: pnpm --filter @vanblog/theme-default exec vitest run

      - name: Run admin editor unit tests
        working-directory: packages/admin
        run: node --test tests/unit/*.test.js

      - name: Run backup restore e2e
        working-directory: packages/server
        run: pnpm test:backup-e2e

      - name: Run post ISR e2e
        working-directory: packages/server
        run: pnpm test:isr-e2e

      - name: Run admin meta e2e
        working-directory: packages/server
        run: pnpm test:admin-meta-e2e

      - name: Run force-login comment e2e
        working-directory: packages/server
        run: pnpm test:force-login-comment-e2e

      - name: Run waline extra options e2e
        working-directory: packages/server
        run: pnpm test:waline-extra-e2e

      - name: Run CDN URL e2e
        working-directory: packages/server
        run: pnpm test:cdn-url-e2e

      - name: Run word count e2e
        working-directory: packages/server
        run: pnpm test:word-count-e2e

      - name: Run friend link e2e
        working-directory: packages/server
        run: pnpm test:friend-link-e2e

      - name: Run page copy e2e
        working-directory: packages/server
        run: pnpm test:page-copy-e2e

      - name: Run admin cache-control e2e
        working-directory: packages/server
        run: pnpm test:admin-cache-e2e

