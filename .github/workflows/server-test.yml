name: server-test

on:
  push:
    branches:
      - dev/dsh
    # 只改文档时不用跑测试（文档站有自己的构建检查）
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    branches:
      - master
      - dev/dsh
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'

# 同一个分支上连着推两次时，把还在跑的那次取消掉：
# 这个 job 要装整个 workspace 的依赖，排队很浪费。
concurrency:
  group: server-test-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ 最小权限：这两个 job 只跑测试、不发布，所以只要 contents: read。不写 permissions: 时
#    push 触发会拿到仓库默认令牌（可能含 write）。触发是 push + pull_request（不是
#    pull_request_target），fork PR 本来就只有只读令牌，所以这条是**收口**而不是补洞 ——
#    写出来是为了将来有人给这两个 workflow 加发布步骤时不会顺手拿到写权限。
permissions:
  contents: read

jobs:
  server-test:
    runs-on: ubuntu-22.04
    # 15 分钟不够：要装整个 workspace 的依赖，再跑 8 个 e2e 套件
    timeout-minutes: 30
    steps:
      - name: Checkout
        # ⚠️ 第三方 action 一律钉到 commit sha，不用可变标签：标签能被上游移动、账号能被接管，
        #    而这些 job 持有写权限（packages/contents）⇒ 那等于把"往 ghcr 推镜像 / 往 Release 挂
        #    vanblog.sh"的能力交出去，而文档正叫用户 `curl … | sh` 以 root 执行那个附件。
        #    sha ↔ 标签的对应写在行尾注释里，升级时重新解析一次即可。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # ⚠️ 这里以前直接跑 6 个 shell 守卫（dockerfile-alpine-sharp / vanblog-update /
      #    vanblog-reset-https / vanblog-uninstall / vanblog-download-fallback /
      #    reverse-proxy-host-header）。它们已经搬到下面的 `guards-core` job，理由：
      #    ① 27 个守卫里只有 6 个进过 CI，剩下的靠人记得跑 —— 本轮 `docs-consistency`
      #       抓到过两条真问题（一个不存在的 `VANBLOG_SHUTDOWN_TIMEOUT_MS` 死旋钮、一个新子命令
      #       没写进 `--help`），而它根本不在 CI 里；
      #    ② 分开的 job 与本 job **并行**，守卫的红灯 2 分钟内就能看到，不用等在这个
      #       要装依赖 + 跑 8 套 e2e 的 30 分钟 job 后面；
      #    ③ 守卫需要的前置（zstd）只需在一个地方准备一次。
      #    `vanblog-backup-encryption` 是例外，它留在本 job —— 它要 `packages/server/dist`
      #    里编译好的 `backupCrypto.js` 才能跑真加密用例（见下面 build 之后那一步）。

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b  # 分支 v2（该仓库没有 v2 这个 tag，@v2 解析到的是可移动分支）
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── 类型检查 ─────────────────────────────────────────────────────────────
      # ⚠️ 为什么是这一步、为什么是这两份配置：本仓库**从来没有在 CI 里做过任何类型检查**
      #    （4 个 workflow 里 grep `tsc`/`tsconfig` 是 0 命中）。后果本轮被证实：
      #    `TS6304: Composite projects may not disable declaration emit` 一路走到镜像构建才爆。
      #
      # ⚠️ 更正一条会被误传的说法：`--noEmit` **能**看到 TS6304
      #    （实测 `tsc -p tsconfig.build.json --noEmit --declaration false` 就报它）。
      #    那次之所以漏掉，是因为**只检查了其中一份配置**：`tsconfig.json` 覆盖 473 个 src 文件、
      #    含 **227 个 spec**；`tsconfig.build.json` 覆盖 245 个、**一个 spec 都不含**
      #    （= 镜像里 `nest build` 的真实形状）。两份互补，所以都要跑。
      #
      # ⚠️ 本机的 `packages/server/tsconfig.dev.json` **没有入库**（它在本机 .git/info/exclude 里，
      #    只是为了绕开家目录里的 @types/bun），所以 CI 里**不能**用它 —— 写了就是"文件不存在"。
      #
      # ⚠️ 不要在 CI 里加 `--strict`：`tsconfig.base.json` 显式写着
      #    `strictNullChecks:false`、`noImplicitAny:false`、`strictBindCallApply:false`，
      #    而**配置里的显式 false 会压过命令行的伞形开关** —— 实测 `--strict` 只报 **6** 个错，
      #    而把各开关逐项列出来是 **380** 个。加 `--strict` 会制造"我们已经很严格了"的假象。
      #    逐步收紧是另一件事（要先把那 380 个清掉），不要用它假装完成。
      - name: Typecheck server (repo config — includes 227 spec files)
        working-directory: packages/server
        run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit --tsBuildInfoFile "${{ runner.temp }}/server-root.tsbuildinfo"

      - name: Typecheck server (build config — the shape the image actually compiles)
        working-directory: packages/server
        run: ./node_modules/.bin/tsc -p tsconfig.build.json --noEmit --tsBuildInfoFile "${{ runner.temp }}/server-build.tsbuildinfo"

      - name: Ensure Next's generated route types exist (next 15 reference in next-env.d.ts)
        # 🔴 next 15 起，`next-env.d.ts` 会自动多出一行
        #    `/// <reference path="./.next/types/routes.d.ts" />`，
        #    而 `packages/website/tsconfig.json` 的 include 里**就有 `next-env.d.ts`** ⇒
        #    在**没构建过的干净 checkout** 上跑 website 的 tsc 会报"找不到该文件"。
        #    那个文件只由 `next build`/`next dev` 生成，而本 job 在这一步之前不构建 website。
        # ⚠️ 为什么用类型桩而不是直接加一个 `next build` 步骤：
        #    ①`next build` 会执行所有页面的 `getStaticProps`，而它们要调后端 API
        #      （本机验证时 server 正在 :3000 跑，所以**无法确认它在没有后端的 CI 里能否成功**）；
        #    ②本项目是纯 Pages Router、**没有启用 typedRoutes**，所以那个文件的内容对类型检查
        #      没有实际贡献 —— 缺的只是"这个路径存在"。
        #    ⇒ 桩文件是最小且确定可行的修法。⚠️ **不要 revert `next-env.d.ts`**：
        #    下次 `next build`/`next dev` 会把那行重新写回来，revert 只会让工作树永久脏。
        # 📌 更好的长期做法（未做，需要单独验证）：像上面 "Build server" 那一步一样，
        #    加一个 "Build website（镜像里跑的同一条命令 `cross-env isBuild=t next build`）"，
        #    并把 typecheck 放在它之后 —— 那样连"镜像的构建命令能过"也一起覆盖了。
        #    前提是确认 `isBuild=t` 真的能让 `getStaticProps` 在没有后端时返回桩数据。
        working-directory: packages/website
        run: |
          mkdir -p .next/types
          if [ ! -f .next/types/routes.d.ts ]; then
            printf '// Generated stub: next 15 adds a reference to this path in next-env.d.ts.\n// The real file is produced by `next build`; this project does not enable typedRoutes.\nexport {}\n' > .next/types/routes.d.ts
            echo "已创建 .next/types/routes.d.ts 类型桩（干净 checkout 上 next-env.d.ts 的 reference 需要它）"
          else
            echo ".next/types/routes.d.ts 已存在（说明这一步之前跑过构建），沿用真实文件"
          fi

      - name: Typecheck website
        working-directory: packages/website
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      # ⚠️ admin 的类型检查**故意不加**：`tsc --noEmit -p packages/admin/tsconfig.json`
      #    当前有 **115 个错**（umi 3 + antd 4 + React 17 的历史包袱）。加进来等于给每个 PR
      #    挂一盏常红灯，而常红灯训练出来的习惯是"忽略红" —— 那比没有检查更糟。
      #    要加就得先清零，那是独立的一件事。

      # ── strictNullChecks 棘轮（只许减不许增）───────────────────────
      # 上面两个 typecheck 用的是仓库配置，而 `tsconfig.json` 里显式写了 `"strictNullChecks": false`，
      # 所以「确定性空值解引用」平时**完全不报**。这一族已经造成过三个真实缺陷（鉴权路径 500 而不是 401、
      # 协作者清单 500、灾难恢复路径上的 TypeError），因此先用棘轮防倒退，再按文件清，最后才谈打开开关。
      # ⚠️ 放在本 job 而不是 guards-core：它需要 node_modules 与 tsc（三次 tsc，实测约 29 秒），
      #    而 guards-core 的定位是「不需要依赖」。
      # 🔴 它必须用**单项开关** `--strictNullChecks`：实测伞形 `--strict` 下四类命中是 **0**
      #    （显式的 CLI 单项开关能压过 tsconfig 里的 false，伞形开关不能）⇒ 换成 --strict 会让守卫恒绿。
      #    脚本内部有一条断言专门钉住这个事实，所以谁「简化」了命令就会红。
      - name: Strict-null ratchet (definite null dereferences may only decrease)
        run: bash scripts/tests/run-guard.sh scripts/tests/strict-null-ratchet.test.sh
      - name: Gitignore hygiene (no source directory may be silently swallowed)
        # 🔴 2026-09-21 加：`.gitignore` 里曾有一条**裸 `log`**（本意是根级日志目录），而
        #    **没有前导 `/` 的 gitignore 模式在任意层级都匹配** ⇒ 它把 `packages/server/src/provider/log/`
        #    与 `packages/server/src/controller/admin/log/` 两个**源码目录**整个吞掉了。
        #    已跟踪的文件因为"gitignore 不会取消跟踪"而照常存在 ⇒ 目录看起来健康、git status 干净，
        #    但**新增文件会被静默忽略**。实际受害者：一个 9 用例的 spec 在全量 jest 里跑了 5 天却从未入库，
        #    导致"跟踪套件数 + 新增 = 267 而 jest --listTests 报 268"永远对不上。
        # ⚠️ 这一步在 guards-core 与 server-test **各出现一次**，是有意的：
        #    守卫的 git 部分不需要依赖（guards-core 就能跑、且失败得早），
        #    而"用 runner 自己的清单再对一次账"那部分需要 jest（只有 server-test 有 node_modules），
        #    缺依赖时守卫会 NOTE 跳过而不是假绿 ⇒ 放在这里它才真的执行。
        run: bash scripts/tests/run-guard.sh scripts/tests/gitignore-hygiene.test.sh
      # ── 真实构建 ─────────────────────────────────────────────────────────────
      # `--noEmit` 看不到"只在真正产出文件时才发生"的失败（输出目录冲突、声明文件产出、
      # 打包期的路径解析）。镜像里跑的就是 `nest build`，所以这里也跑它 ——
      # 顺便产出 `dist/`，让下面那个需要编译产物的守卫能跑**完整**用例而不是跳过。
      - name: Build server (the exact command the image runs)
        working-directory: packages/server
        run: pnpm run build

      - name: Run backup encryption / passphrase / rotate-jwt tests (needs dist for the real-crypto cases)
        # ⚠️ 这个守卫会探测 `tar zstd sha256sum curl node`，缺任何一个就 `passed=0 failed=1`
        #    硬失败；而**真加密**用例还要求 `packages/server/dist/src/utils/backupCrypto.js`
        #    存在，缺了它会 `note` 跳过并仍然"通过" —— 那就是一个只验证了假设的绿灯。
        #    所以下面断言 `note=0`：静默降级成跳过必须算失败。
        run: |
          set -uo pipefail
          # ⚠️ 不用 `tee /dev/stderr`：那个路径在有些环境里不是设备（实测本机报
          #    "No such device or address"），而它在 GitHub runner 上恰好可用 —— 这种
          #    "换个环境就失败"的写法不该进 CI。改成先整体捕获、再原样打印。
          out="$(bash scripts/tests/vanblog-backup-encryption.test.sh 2>&1)"
          printf '%s\n' "${out}" | tail -60
          line="$(printf '%s\n' "${out}" | grep -E '^passed=' | tail -1)"
          [ -n "${line}" ] || { echo "::error::守卫没有输出 passed= 行（脚本本身崩了？）"; exit 1; }
          printf '%s\n' "${line}" | grep -q 'failed=0' || { echo "::error::加密备份守卫有失败项：${line}"; exit 1; }
          printf '%s\n' "${line}" | grep -q 'note=0' || { echo "::error::加密备份守卫 note>0 ⇒ 真加密用例被跳过（dist 里没有 backupCrypto.js？），这不是有效绿灯：${line}"; exit 1; }

      - name: Backup signature guard (needs dist; asserts note=0)
        # 🔴 这一步在 2026-09-21 之前**根本不存在**：`vanblog-backup-signing.test.sh`（210 条断言，
        #    覆盖 ed25519 签名、`.sig` 旁证、五种验签结论、以及"匿名恢复路径没有跳过验签的开关"）
        #    没有被任何 workflow 引用 ⇒ **谁改坏了签名或验签，CI 全绿**。
        #    发现方式是"枚举 scripts/tests/*.test.sh 与三个 workflow 的引用做差集"，
        #    下面 guards-core 里新增的那一步把这个差集检查变成了常驻守卫。
        # ⚠️ 它与 `vanblog-backup-encryption` 是**完全相同的形状**：需要 `packages/server/dist`
        #    （`.sig` fixture 用服务端自己的实现 `dist/src/utils/backupSigning.js` 生成，
        #    避免"只证明测试自己的假设自洽"），缺 dist 时**不失败、只 NOTE 跳过** ⇒ 必须断言 `note=0`，
        #    否则它会在 CI 里安静地少跑一大半。
        run: |
          out="$(bash scripts/tests/vanblog-backup-signing.test.sh 2>&1)"
          printf '%s\n' "${out}" | tail -60
          line="$(printf '%s\n' "${out}" | grep -E '^passed=' | tail -1)"
          [ -n "${line}" ] || { echo "::error::守卫没有输出 passed= 行（脚本本身崩了？）"; exit 1; }
          printf '%s\n' "${line}" | grep -q 'failed=0' || { echo "::error::备份签名守卫有失败项：${line}"; exit 1; }
          printf '%s\n' "${line}" | grep -q 'note=0' || { echo "::error::备份签名守卫 note>0 ⇒ 真签名用例被跳过（dist 里没有 backupSigning.js？）；这一步必须跟在 Build 之后"; exit 1; }

      - name: Run vanblog.sh restore tests (needs node_modules for the js-sha256 cross-check)
        # ⚠️ 这个守卫会去找 `node_modules/.pnpm/js-sha256@*`，用它交叉验证
        #    `vanblog.sh` 的登录口令派生与后台 `encryptPwd.js` 逐字节一致。
        #    找不到时它**不失败、只是少跑那几条断言** ⇒ 放在没装依赖的 job 里会得到一个
        #    "覆盖面悄悄变小但仍然绿"的结果，所以它必须跟在 Install 之后跑。
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-restore.test.sh
      - name: Run server unit tests
        working-directory: packages/server
        # ⚠️ 这里以前是一条 80 项的 `--testPathPattern` 白名单。2026-09-17 盘点：
        # **src 下 169 个 spec 里有 47 个从来没在 CI 跑过** —— 包括 setupKey / accessPassword /
        # staticGuard / bruteForceIp / artifactReaper / searchIndex / publishAt / revision /
        # migration / health.controller / unlockBruteforce / mdzImport / logRotate / backupVerify
        # 这些安全与备份相关的钉子。白名单的问题是它只会烂：新增 spec 默认不跑，
        # 而且"CI 绿了"会让人以为全都跑过了（本项目已经因此让一条永久红的 e2e 混了 20 次）。
        # 所以改成**默认全跑**，确实不能在 CI 跑的才排除。目前排除清单为空，因为：
        #   - 要真库的 `searchIndex.realdb.spec.ts` 自己默认 `describe.skip`
        #     （要 VANBLOG_SEARCH_REALDB=1 外加 _PORT/_DBPATH 指到一次性库才跑）；
        #   - `test/` 下那些要 mongod 的 e2e 被 jest 的 rootDir=src + testRegex 天然排除，
        #     各有独立的 `test:*-e2e` 命令、独立端口与"拒绝 27017/真实库名"的硬护栏；
        #   - walineMongo / fullBackup / initJwt / audit-hardening-round2 里的 MongoClient 都是假的，
        #     不需要真库（本来就在白名单里、CI 一直是绿的）。
        # 🔴 2026-09-21 加失败诊断：本步骤在 CI 上间歇红（仓库有 7 个已知负载敏感假红 spec，
        #    见 AGENTS.md §7.72 清单），而本机 deploy key 读不了 job 日志（403，日志接口要
        #    actions:read）⇒ 红了等于盲。现在把 jest 输出 tee 到文件，失败时把 FAIL 套件行与
        #    `●` 失败用例行转成 ::error annotations —— annotations 走公开 API
        #    （/check-runs/{id}/annotations）就能读。退出码原样透传（PIPESTATUS），
        #    不放宽、不加重任何断言；这是**诊断**，不是修 flake 本身（修在 spec 里，另案）。
        run: |
          set -u
          set +e  # ⚠️ runner 默认 shell 是 `bash -e`：不显式关掉 errexit 的话，
                  #    下面管道一失败整个 step 就地中止，::error 注解永远打不出来。
          log="${RUNNER_TEMP:-/tmp}/jest-full.log"
          pnpm test -- --passWithNoTests=false 2>&1 | tee "${log}"
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            grep -E '^FAIL ' "${log}" | sort -u | head -20 | while IFS= read -r l; do echo "::error::失败套件 ${l}"; done
            grep -E '^[[:space:]]+● ' "${log}" | grep -v 'Console' | sort -u | head -30 | while IFS= read -r l; do echo "::error::失败用例 ${l}"; done
            tail -30 "${log}"
          fi
          exit "${rc}"

      - name: Run website unit tests
        run: pnpm --filter @vanblog/theme-default exec vitest run

      - name: Run admin editor unit tests
        working-directory: packages/admin
        # 🔴 2026-09-21 加失败诊断（与上面 "Run server unit tests" 同一手法，复用已验证的 wrapper 形状）：
        #    这一步曾在 CI 上**长期红而本机全绿**，而本机 deploy key 读不了 job 日志
        #    （/actions/jobs/<id>/logs 返回 403「Must have admin rights」）⇒ 红了等于瞎。
        #    ::error annotations 走**公开** API（/check-runs/{id}/annotations）就能读，
        #    本轮正是靠它才定位到 guards-slow 演练守卫的确切失败断言。
        #    根因（已复现）：package.json 的 `postinstall: umi g tmp` 会在 CI 的 install 步骤里
        #    **生成 src/.umi**，所以 CI 上 `.umi` 是**存在**的、只是没有 `.cache/`；
        #    而 `showQuickJumper` 只存在于 `.cache/**` ⇒ 旧断言"存在就要求命中 >0"必然红。
        #    已改成三态断言（见 paginationQuickJumper.test.js 的 (B0)/(B)）。
        # ⚠️ 退出码原样透传（PIPESTATUS），不放宽、不加重任何断言 —— 这是**诊断**，不是修 flake。
        # ⚠️ `set +e` 是必需的：runner 默认 `bash -e`，否则管道一失败整个 step 就地中止、注解打不出来。
        run: |
          set -u
          set +e
          log="${RUNNER_TEMP:-/tmp}/admin-unit.log"
          node --test tests/unit/*.test.js 2>&1 | tee "${log}"
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            # node --test 失败时的可用信号：✖ 用例行、"✖ failing tests:" 段里的 AssertionError、
            # 以及 ℹ 汇总行。⚠️ 只取前若干条，不把整段日志塞进 annotation（有长度限制且会淹没有用信息）。
            grep -aE '^(✖|not ok )' "${log}" | sort -u | head -20 | while IFS= read -r l; do echo "::error::admin 单测失败用例 ${l}"; done
            grep -aE 'AssertionError|Error \[|SyntaxError|Cannot find module|ENOENT' "${log}" | sort -u | head -15 | while IFS= read -r l; do echo "::error::admin 单测错误 ${l}"; done
            grep -aE '^ℹ (tests|suites|pass|fail|cancelled|skipped)' "${log}" | while IFS= read -r l; do echo "::error::admin 单测汇总 ${l}"; done
            tail -40 "${log}"
          fi
          exit "${rc}"

      - name: Run backup restore e2e
        working-directory: packages/server
        run: pnpm test:backup-e2e

      - name: Run post ISR e2e
        working-directory: packages/server
        run: pnpm test:isr-e2e

      - name: Run admin meta e2e
        working-directory: packages/server
        run: pnpm test:admin-meta-e2e

      - name: Run force-login comment e2e
        working-directory: packages/server
        run: pnpm test:force-login-comment-e2e

      - name: Run waline extra options e2e
        working-directory: packages/server
        run: pnpm test:waline-extra-e2e

      - name: Run CDN URL e2e
        working-directory: packages/server
        run: pnpm test:cdn-url-e2e

      - name: Run word count e2e
        working-directory: packages/server
        run: pnpm test:word-count-e2e

      - name: Run friend link e2e
        working-directory: packages/server
        run: pnpm test:friend-link-e2e

      - name: Run page copy e2e
        working-directory: packages/server
        run: pnpm test:page-copy-e2e

      - name: Run admin cache-control e2e
        working-directory: packages/server
        run: pnpm test:admin-cache-e2e

  # ══════════════════════════════════════════════════════════════════════════
  # 守卫（shell 断言）—— 与 server-test **并行**，不装 workspace 依赖
  # ══════════════════════════════════════════════════════════════════════════
  # 为什么单独一个 job：本仓库有 **27 个** shell 守卫（合计约 2500 条断言），而 CI 里以前只跑
  # **6 个**。剩下 21 个全靠人记得跑，于是本轮真实发生了两次"守卫抓到了问题、但没人跑守卫"：
  #   · `docs-consistency` 抓到一个**不存在的环境变量** `VANBLOG_SHUTDOWN_TIMEOUT_MS`
  #     被写进了面向用户的报错文案（死旋钮），还抓到一个新子命令没写进 `--help`；
  #   · `TS6304: Composite projects may not disable declaration emit` 一路走到**镜像构建**才爆。
  # 这些守卫绝大多数是"用桩替代 docker/compose/curl 的纯逻辑测试"，不需要依赖、不需要引擎，
  # 单个 0.1–7 秒，所以进 PR 档的成本极低（整个 job 约 2 分钟）。
  #
  # ⚠️ 分档判据（写下来，免得下一个人凭感觉挪）：
  #   · **这个 job**：不需要 `node_modules`、不需要 `dist`、不需要容器引擎、不需要 caddy 二进制
  #     （`caddy-perf` 在没有 caddy 时会**优雅跳过** validate 环节 ⇒ 这里跑的是部分覆盖，
  #       完整覆盖在 `nightly.yml` 里装了 caddy 之后跑）。
  #   · **guards-slow**：同样无外部依赖，但单个超过 30 秒，放一起以免拖慢这个 job。
  #   · **server-test job**：需要 `node_modules`（`vanblog-restore` 用 js-sha256 交叉验证口令派生）
  #     或 `dist`（`vanblog-backup-encryption` 用编译好的 `backupCrypto.js` 跑真加密）。
  #     这两个守卫在缺依赖时**不会失败、只会静默少跑断言**，所以必须跟在 Install/Build 之后。
  #   · **nightly.yml**：真需要容器引擎、真 caddy 二进制、真镜像构建、或真归档的
  #     （`vanblog-drill` 的活体部分 `VANBLOG_DRILL_LIVE=1`、`build-image-local.sh` 真构建、
  #       `caddy-perf` 的 validate 环节、`docs:build`）。
  guards-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        # 守卫里有一部分直接调 `node`（生成 caddy 配置、跑假服务器、解析 JSON），
        # 用的是仓库脚本而不是 workspace 代码 ⇒ **不需要 pnpm install**。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Ensure zstd is available
        # ⚠️ `vanblog-verify` 在**没有 zstd 时是硬失败**（实测 `passed=0 failed=1`），
        #    而它并不探测这个工具；`vanblog-backup-encryption` 则会探测并 `exit 1`。
        #    runner 镜像里有没有 zstd 是**不应依赖的假设**，所以缺了就装（有则零成本跳过）。
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            echo "zstd 不在 runner 上，安装它（vanblog-verify 硬依赖）"
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          zstd --version

      - name: Docs internal links
        run: bash scripts/tests/run-guard.sh scripts/tests/docs-links.test.sh
      - name: Docs ↔ code consistency (env var names, script copies, --help coverage)
        run: bash scripts/tests/run-guard.sh scripts/tests/docs-consistency.test.sh
      - name: Caddy config generation
        run: bash scripts/tests/run-guard.sh scripts/tests/caddy-config.test.sh
      - name: Caddy pages-dir cross-language parity (TS resolver vs generator)

        # ⚠️ 同一个环境变量被 TS（服务端三处）与 JS（生成器）两种语言消费时，规则必须逐条对齐。

        # 这条守卫真跑两侧并比对结论（共用一张 32 条取值表 scripts/tests/fixtures/pages-dir-cases.json），

        # 而不是"两边都提到某个关键词"那种空断言。只需 node，不依赖 node_modules/dist/caddy 二进制，

        # 本机 91 条约 25 秒 ⇒ 放 PR 档。

        run: bash scripts/tests/run-guard.sh scripts/tests/caddy-pages-dir-parity.test.sh
      - name: Caddy performance-related config (validate steps skip without a caddy binary)
        run: bash scripts/tests/run-guard.sh scripts/tests/caddy-perf.test.sh
      - name: Official Dockerfile Alpine/sharp assertions
        run: bash scripts/tests/run-guard.sh scripts/tests/dockerfile-alpine-sharp.test.sh
      - name: Dockerfile patch/npmrc assertions
        run: bash scripts/tests/run-guard.sh scripts/tests/dockerfile-patches.test.sh
      - name: Image runtime (entrypoint, HEALTHCHECK, start.js contract)
        run: bash scripts/tests/run-guard.sh scripts/tests/image-runtime.test.sh
      - name: start.js process supervision
        run: bash scripts/tests/run-guard.sh scripts/tests/start-js.test.sh
      - name: build-image-local.sh static contract
        run: bash scripts/tests/run-guard.sh scripts/tests/build-image-local.test.sh
      - name: Benchmark harness (failure classification, kernel counters, no silent hangs)
        run: bash scripts/tests/run-guard.sh scripts/tests/benchmark-tool.test.sh
      - name: vanblog.sh hardening assertions
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-hardening.test.sh
      - name: Generated compose health
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-compose-health.test.sh
      - name: vanblog.sh install-cron
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-install-cron.test.sh
      - name: vanblog.sh reset
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-reset.test.sh
      - name: vanblog.sh verify
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-verify.test.sh
      - name: vanblog.sh backup-restore
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-backup-restore.test.sh
      - name: vanblog.sh disaster recovery / offline install
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-dr-offline.test.sh
      - name: waline reset
        run: bash scripts/tests/run-guard.sh scripts/tests/reset-waline.test.sh
      - name: vanblog.sh update
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-update.test.sh
      - name: vanblog.sh https reset
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-reset-https.test.sh
      - name: vanblog.sh uninstall
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-uninstall.test.sh
      - name: vanblog.sh download fallback
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-download-fallback.test.sh
      - name: Reverse-proxy nginx Host header and cache-bypass docs
        run: bash scripts/tests/run-guard.sh scripts/tests/reverse-proxy-host-header.test.sh

      - name: CI guard wrapper (exit-code passthrough for all 34 wrapped guard steps)
        # 🔴 **这一步刻意不经过 run-guard.sh 自己**：它测的就是那个 wrapper，
        #    而 wrapper 若坏了（吞掉退出码），用它来跑"测它的守卫"会把失败一起吞掉
        #    —— 那是循环依赖。所以这里用裸形式，让失败一定能冒出来。
        # 🔴 为什么它值得单独一步：run-guard.sh 是 CI 里 34 个守卫步骤的共同入口，
        #    它唯一的关键职责是原样透传退出码；一旦吞掉，**所有守卫会同时变成装饰品**
        #    （照跑、照打印 FAIL，而 job 依然 success）—— 一种"全绿但什么都没在守"的失效，
        #    而且从 CI 界面上完全看不出来。
        run: bash scripts/tests/ci-guard-wrapper.test.sh
  # 慢守卫：同样**无外部依赖**，只是单个耗时 30 秒以上，分开跑以免拖慢 guards-core。
  # 两个加起来约 3 分钟（本机实测：drill 148s、source-install 32s）。
      - name: Gitignore hygiene (no source directory may be silently swallowed)
        # 🔴 2026-09-21 加：`.gitignore` 里曾有一条**裸 `log`**（本意是根级日志目录），而
        #    **没有前导 `/` 的 gitignore 模式在任意层级都匹配** ⇒ 它把 `packages/server/src/provider/log/`
        #    与 `packages/server/src/controller/admin/log/` 两个**源码目录**整个吞掉了。
        #    已跟踪的文件因为"gitignore 不会取消跟踪"而照常存在 ⇒ 目录看起来健康、git status 干净，
        #    但**新增文件会被静默忽略**。实际受害者：一个 9 用例的 spec 在全量 jest 里跑了 5 天却从未入库，
        #    导致"跟踪套件数 + 新增 = 267 而 jest --listTests 报 268"永远对不上。
        # ⚠️ 这一步在 guards-core 与 server-test **各出现一次**，是有意的：
        #    守卫的 git 部分不需要依赖（guards-core 就能跑、且失败得早），
        #    而"用 runner 自己的清单再对一次账"那部分需要 jest（只有 server-test 有 node_modules），
        #    缺依赖时守卫会 NOTE 跳过而不是假绿 ⇒ 放在这里它才真的执行。
        run: bash scripts/tests/run-guard.sh scripts/tests/gitignore-hygiene.test.sh
      - name: Every guard script must be wired into some workflow
        # 🔴 这一步是 2026-09-21 加的，因为刚刚发现 `vanblog-backup-signing.test.sh`
        #    （210 条断言，覆盖 ed25519 签名 / `.sig` 旁证 / 五种验签结论 / "匿名恢复没有跳过验签的开关"）
        #    **没有被任何 workflow 引用** ⇒ 谁改坏了签名或验签，CI 全绿。
        #    而这是**第二次**漏接守卫（第一次是 `caddy-pages-dir-parity`，当时是"新增了守卫但没接 CI"）。
        #    ⇒ 只补那一个不解决"还会再漏"，所以把差集检查本身做成常驻守卫：
        #    **新增 `scripts/tests/*.test.sh` 而忘了接 CI，这一步就会红。**
        # ⚠️ 判据是"被某个 workflow 文件按文件名引用"，通配循环（`for t in scripts/tests/*`）不算 ——
        #    本仓库的三个 workflow 都是**逐个点名**跑的（为了给每个守卫写清"为什么在这个 job"），
        #    所以这里也只认点名。⚠️ 如果将来改成通配循环，这一步要同步改成"确认循环真的覆盖到"。
        run: |
          missing=""
          for f in scripts/tests/*.test.sh; do
            b="$(basename "$f")"
            if ! grep -rqF "$b" .github/workflows/ ; then
              missing="${missing} ${b}"
            fi
          done
          total="$(ls scripts/tests/*.test.sh | wc -l)"
          echo "守卫脚本共 ${total} 个"
          if [ -n "${missing}" ]; then
            echo "::error::以下守卫脚本没有被任何 workflow 引用（CI 不会跑它）：${missing}"
            echo "接法：需要 dist 或 node_modules 的放 server-test job（并断言 note=0，否则它会静默少跑）；"
            echo "      不需要依赖且 <30s 的放 guards-core；>30s 的放 guards-slow；"
            echo "      需要容器引擎/真 caddy/真镜像/真归档的放 nightly.yml。"
            exit 1
          fi
          echo "✔ ${total} 个守卫全部已接入 CI"

  guards-slow:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Ensure zstd is available
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          zstd --version

      - name: Restore drill logic (629 assertions; the live container part stays off)
        # ⚠️ 这个守卫分两部分：A) 纯逻辑，**默认全部跑**（629 条，本机实测 143 秒）；
        #    B) 活体演练，需要引擎 + 镜像 + **一份真归档**，默认跳过并说明原因，
        #    只有 `VANBLOG_DRILL_LIVE=1` 才跑。CI 里跑不了 B —— 归档是站点数据，
        #    不能进仓库，所以那部分永远是"人工在演练机上跑"，不要以为这里覆盖了它。
        # 🔴 2026-09-21 加失败诊断：本步骤在 CI 上**从加入当天（09-20 首跑）起每次都红**，
        #    而本机把 runner 的工具链逐个复现（bash 5.1.16、tar 1.34、zstd 1.5.x、mawk/gawk、
        #    env -i 最小环境、TZ=UTC）全部 629/0 绿 ⇒ 差异还没找到；deploy key 又读不了日志（403）。
        #    现在失败时把 `FAIL:` 行转成 ::error annotations（公开 API 可读），下一次红会直接
        #    点名是哪几条断言、got/want 是什么。rc 原样透传，断言一条没动。
        run: |
          set -u
          set +e  # runner 默认 `bash -e`：不关掉 errexit，失败时走不到下面的注解块
          log="${RUNNER_TEMP:-/tmp}/drill.log"
          bash scripts/tests/vanblog-drill.test.sh 2>&1 | tee "${log}"
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            grep -E '^FAIL:' "${log}" | head -30 | while IFS= read -r l; do echo "::error::drill 断言失败 ${l}"; done
            grep -E '^passed=' "${log}" | tail -1
            tail -20 "${log}"
          fi
          exit "${rc}"

      - name: Source-install path (fake git/docker/compose, no network, no daemon)
        run: bash scripts/tests/run-guard.sh scripts/tests/vanblog-source-install.test.sh