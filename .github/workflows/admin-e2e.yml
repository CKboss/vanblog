name: admin-e2e

on:
  push:
    branches:
      - dev/dsh
    # 只改文档时不用跑测试（文档站有自己的构建检查）
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/admin-e2e.yml'
  pull_request:
    branches:
      - master
      - dev/dsh
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'

# 同一个分支上连着推两次时，把还在跑的那次取消掉：
# 这个 job 要装整个 workspace 的依赖，排队很浪费。
concurrency:
  group: admin-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run admin editor unit tests
        working-directory: packages/admin
        run: node --test tests/unit/*.test.js

      - name: Install Playwright Chromium
        working-directory: packages/admin
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # 这个 job 曾经 **19/20 次失败、从未绿过**，一度被临时标成 continue-on-error（永久红的 CI
      # 会让每次发布都看起来有问题）。根因已在本地复现并修掉：不是基础设施问题，而是
      # `toc-heading.spec.js` 抓到的一个**真 bug** —— TOC 公式插件的"已加载"通知不是粘性的，
      # 而加载在首次渲染时就发起、订阅在 useEffect 里才发生，所以只要 import 先 resolve
      # （esbuild 把动态 import 内联时是微任务级）通知就发给了空集合，标签永远停在 `$A$<$B$` 原文。
      # 修复在 `packages/website/components/MarkdownTocBar/tocMath.ts`，本地全套 **111 passed**。
      # 因此这里**恢复门禁**（去掉 continue-on-error）。下面的诊断步骤保留：
      # 下次再红时，artifact 里有 playwright 报告与 trace，不必再靠 token 去捞 job 日志。
      - name: 先确认 playwright 配置能解析（便宜的早期信号）
        working-directory: packages/admin
        run: ./node_modules/.bin/playwright test --list 2>&1 | tail -20

      - name: Run admin mermaid e2e
        working-directory: packages/admin
        run: |
          # 把 7 个 webServer 的启动情况先打出来：任何一个起不来，后面的用例会以
          # "页面打不开"的形式失败，而真正的原因只在 webServer 的 stderr 里。
          for f in tests/e2e/serve-admin.mjs tests/e2e/serve-fixture.mjs \
                   tests/e2e/backup-restore-server.mjs tests/e2e/post-isr-server.mjs \
                   tests/e2e/admin-meta-server.mjs; do
            [ -f "$f" ] || echo "  ✗ 缺 webServer 脚本: $f"
          done
          node -e "const c=require('./playwright.config.js');console.log('  webServer 数量:',(c.webServer||[]).length);(c.webServer||[]).forEach((w,i)=>console.log('   ',i,w.command,'→',w.url||('port '+w.port),'timeout',w.timeout))"
          pnpm test:e2e --reporter=list

      - name: 失败时上传诊断物证
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-diagnostics
          path: |
            packages/admin/playwright-report/
            packages/admin/test-results/
          if-no-files-found: ignore
          retention-days: 14
