name: admin-e2e

on:
  push:
    branches:
      - dev/dsh
    # 只改文档时不用跑测试（文档站有自己的构建检查）
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/admin-e2e.yml'
  pull_request:
    branches:
      - master
      - dev/dsh
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'

# 同一个分支上连着推两次时，把还在跑的那次取消掉：
# 这个 job 要装整个 workspace 的依赖，排队很浪费。
concurrency:
  group: admin-e2e-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ 最小权限：这两个 job 只跑测试、不发布，所以只要 contents: read。不写 permissions: 时
#    push 触发会拿到仓库默认令牌（可能含 write）。触发是 push + pull_request（不是
#    pull_request_target），fork PR 本来就只有只读令牌，所以这条是**收口**而不是补洞 ——
#    写出来是为了将来有人给这两个 workflow 加发布步骤时不会顺手拿到写权限。
permissions:
  contents: read

jobs:
  admin-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # ⚠️ 第三方 action 一律钉到 commit sha，不用可变标签：标签能被上游移动、账号能被接管，
        #    而这些 job 持有写权限（packages/contents）⇒ 那等于把"往 ghcr 推镜像 / 往 Release 挂
        #    vanblog.sh"的能力交出去，而文档正叫用户 `curl … | sh` 以 root 执行那个附件。
        #    sha ↔ 标签的对应写在行尾注释里，升级时重新解析一次即可。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b  # 分支 v2（该仓库没有 v2 这个 tag，@v2 解析到的是可移动分支）
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run admin editor unit tests
        working-directory: packages/admin
        # 🔴 2026-09-21 加失败诊断（与上面 "Run server unit tests" 同一手法，复用已验证的 wrapper 形状）：
        #    这一步曾在 CI 上**长期红而本机全绿**，而本机 deploy key 读不了 job 日志
        #    （/actions/jobs/<id>/logs 返回 403「Must have admin rights」）⇒ 红了等于瞎。
        #    ::error annotations 走**公开** API（/check-runs/{id}/annotations）就能读，
        #    本轮正是靠它才定位到 guards-slow 演练守卫的确切失败断言。
        #    根因（已复现）：package.json 的 `postinstall: umi g tmp` 会在 CI 的 install 步骤里
        #    **生成 src/.umi**，所以 CI 上 `.umi` 是**存在**的、只是没有 `.cache/`；
        #    而 `showQuickJumper` 只存在于 `.cache/**` ⇒ 旧断言"存在就要求命中 >0"必然红。
        #    已改成三态断言（见 paginationQuickJumper.test.js 的 (B0)/(B)）。
        # ⚠️ 退出码原样透传（PIPESTATUS），不放宽、不加重任何断言 —— 这是**诊断**，不是修 flake。
        # ⚠️ `set +e` 是必需的：runner 默认 `bash -e`，否则管道一失败整个 step 就地中止、注解打不出来。
        run: |
          set -u
          set +e
          log="${RUNNER_TEMP:-/tmp}/admin-unit.log"
          node --test tests/unit/*.test.js 2>&1 | tee "${log}"
          rc=${PIPESTATUS[0]}
          if [ "${rc}" -ne 0 ]; then
            # node --test 失败时的可用信号：✖ 用例行、"✖ failing tests:" 段里的 AssertionError、
            # 以及 ℹ 汇总行。⚠️ 只取前若干条，不把整段日志塞进 annotation（有长度限制且会淹没有用信息）。
            grep -aE '^(✖|not ok )' "${log}" | sort -u | head -20 | while IFS= read -r l; do echo "::error::admin 单测失败用例 ${l}"; done
            grep -aE 'AssertionError|Error \[|SyntaxError|Cannot find module|ENOENT' "${log}" | sort -u | head -15 | while IFS= read -r l; do echo "::error::admin 单测错误 ${l}"; done
            grep -aE '^ℹ (tests|suites|pass|fail|cancelled|skipped)' "${log}" | while IFS= read -r l; do echo "::error::admin 单测汇总 ${l}"; done
            tail -40 "${log}"
          fi
          exit "${rc}"

      - name: Install Playwright Chromium
        working-directory: packages/admin
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # 这个 job 曾经 **19/20 次失败、从未绿过**，一度被临时标成 continue-on-error（永久红的 CI
      # 会让每次发布都看起来有问题）。根因已在本地复现并修掉：不是基础设施问题，而是
      # `toc-heading.spec.js` 抓到的一个**真 bug** —— TOC 公式插件的"已加载"通知不是粘性的，
      # 而加载在首次渲染时就发起、订阅在 useEffect 里才发生，所以只要 import 先 resolve
      # （esbuild 把动态 import 内联时是微任务级）通知就发给了空集合，标签永远停在 `$A$<$B$` 原文。
      # 修复在 `packages/website/components/MarkdownTocBar/tocMath.ts`，本地全套 **111 passed**。
      # 因此这里**恢复门禁**（去掉 continue-on-error）。下面的诊断步骤保留：
      # 下次再红时，artifact 里有 playwright 报告与 trace，不必再靠 token 去捞 job 日志。
      - name: 先确认 playwright 配置能解析（便宜的早期信号）
        working-directory: packages/admin
        run: ./node_modules/.bin/playwright test --list 2>&1 | tail -20

      - name: Run admin mermaid e2e
        working-directory: packages/admin
        run: |
          # 把 7 个 webServer 的启动情况先打出来：任何一个起不来，后面的用例会以
          # "页面打不开"的形式失败，而真正的原因只在 webServer 的 stderr 里。
          for f in tests/e2e/serve-admin.mjs tests/e2e/serve-fixture.mjs \
                   tests/e2e/backup-restore-server.mjs tests/e2e/post-isr-server.mjs \
                   tests/e2e/admin-meta-server.mjs; do
            [ -f "$f" ] || echo "  ✗ 缺 webServer 脚本: $f"
          done
          node -e "const c=require('./playwright.config.js');console.log('  webServer 数量:',(c.webServer||[]).length);(c.webServer||[]).forEach((w,i)=>console.log('   ',i,w.command,'→',w.url||('port '+w.port),'timeout',w.timeout))"
          pnpm test:e2e --reporter=list

      - name: 失败时上传诊断物证
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: admin-e2e-diagnostics
          path: |
            packages/admin/playwright-report/
            packages/admin/test-results/
          if-no-files-found: ignore
          retention-days: 14
