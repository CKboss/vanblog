name: admin-e2e

on:
  push:
    branches:
      - dev/dsh
    # 只改文档时不用跑测试（文档站有自己的构建检查）
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/admin-e2e.yml'
  pull_request:
    branches:
      - master
      - dev/dsh
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'caddyTemplate.json'
      - 'caddyFallbackTemplate.json'
      - 'docker-compose/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'patches/**'

# 同一个分支上连着推两次时，把还在跑的那次取消掉：
# 这个 job 要装整个 workspace 的依赖，排队很浪费。
concurrency:
  group: admin-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.11.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run admin editor unit tests
        working-directory: packages/admin
        run: node --test tests/unit/*.test.js

      - name: Install Playwright Chromium
        working-directory: packages/admin
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run admin mermaid e2e
        working-directory: packages/admin
        run: pnpm test:e2e
