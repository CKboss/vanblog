# 把本分支构建成镜像推到 ghcr.io，让安装脚本回到「docker pull 就能装」。
#
# 为什么要这个：上游是作者在自己的 CI 里构建好镜像再发布的，用户只需要 pull；
# 而本分支以前没有发布镜像，一键脚本只能 clone 源码 + 本地 docker build ——
# 于是构建从 CI 挪到了用户机器上，1C2G 的小机器根本装不了（umi build 峰值 1.5-2GB、
# next build 2-4GB，而 BuildKit 还会并发跑三个 stage）。
#
# ⚠️ ghcr 的包**默认是 private** 且与仓库绑定。第一次跑完这个 workflow 之后，
#    要去 https://github.com/CKboss?tab=packages 找到 vanblog 这个 package，
#    Package settings → Danger Zone → Change visibility → Public，
#    否则别人 docker pull 会要求登录（脚本探测到拉不动就会退回源码构建）。
#
# 用 GITHUB_TOKEN 就够了，不需要配任何 secret。
#
# ── 什么时候构建 ────────────────────────────────────────────────────────
# **不是每次 push 都构建**：一次构建要 20-40 分钟的 runner 时间，而这个分支
# 一天能推几十次（大多是文档和测试），没必要每次都出一个镜像。所以只在两种情况下跑：
#   1. 手动触发（Actions 页面 → publish-ghcr → Run workflow）—— 平时想发一版就点这个；
#   2. 推 `v*` 标签 —— 当作正式发版。
# 想在 push 时也自动发，把下面注释掉的 branches 段放开即可（也可以配 paths 过滤，
# 只在 packages/**、Dockerfile、patches/**、pnpm-lock.yaml 变化时才构建）。
name: publish-ghcr

on:
  push:
    # branches:
    #   - dev/dsh
    # paths:
    #   - 'packages/**'
    #   - 'patches/**'
    #   - 'Dockerfile'
    #   - 'pnpm-lock.yaml'
    #   - 'package.json'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建架构（逗号分隔）。加 arm64 会走 QEMU 模拟，慢好几倍且容易超时'
        required: false
        default: 'linux/amd64'
      extra_tag:
        description: '额外打一个标签（留空则只按分支名/tagName 打）'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  # ⚠️ 不能直接用 ${{ github.repository }} 当镜像名：ghcr（和 Docker 一样）要求
  #    镜像引用**全小写**，而这个仓库的 owner 是 `CKboss`，带大写字母。
  #    直接拼会得到 ghcr.io/CKboss/vanblog → `invalid reference format`，
  #    而且报错发生在构建之后，白白浪费几十分钟 runner。
  #    Actions 表达式里没有 lower() 函数，所以下面用一个 shell step 算出小写名。

# 同一个 ref 上只跑一次：新的运行会把还在跑的旧运行取消掉，省 runner 时间
concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 三个 stage 串行算下来（amd64）大约 20-40 分钟；留足余量
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: 镜像名（ghcr 要求全小写）
        id: image
        run: |
          raw="${{ github.repository }}"
          name="$(printf '%s' "${raw}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "镜像：${REGISTRY}/${name}"
          # 早点失败，别等构建完才发现引用非法
          case "${name}" in
            *[A-Z]*) echo "::error::镜像名仍含大写字母：${name}" ; exit 1 ;;
          esac

      - name: 版本标签（写进镜像的 VAN_BLOG_VERSION，后台「关于」与页脚会显示）
        id: ver
        run: |
          sha="$(git rev-parse --short HEAD)"
          ref_name="${GITHUB_REF_NAME}"
          # 分支名里的 / 不能直接当 tag 用
          safe_ref="$(printf '%s' "${ref_name}" | tr '/' '-')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "safe_ref=${safe_ref}" >> "$GITHUB_OUTPUT"
          echo "version=${safe_ref}@${sha}" >> "$GITHUB_OUTPUT"
          echo "构建版本：${safe_ref}@${sha}"

      # ⚠️ 以前这里写的是 `if [ -n "${{ inputs.platforms }}" ]; then echo "platforms=${{ inputs.platforms }}"`
      #    —— 把 workflow_dispatch 的输入**直接插进 shell 脚本正文**。含 `"` 或 `$(…)` 的输入
      #    就能在这个 job 上执行任意命令，而它持有 `packages: write`（能往 ghcr 推镜像）。
      #    触发前提是对仓库有写权限，所以不是远程可利用的洞；但"能改仓库内容"与"能改这个 job
      #    执行的内容"不该是同一件事，而且手滑粘贴也会把构建搞坏（20-40 分钟后才失败）。
      #    现在：输入一律经 `env:` 传入（GitHub 不会把 env 的值当代码解析），并做字符集校验。
      - name: 净化 dispatch 输入
        id: inputs
        env:
          RAW_PLATFORMS: ${{ inputs.platforms }}
          RAW_EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          set -eu
          platforms="${RAW_PLATFORMS}"
          extra_tag="${RAW_EXTRA_TAG}"
          if [ -n "${platforms}" ]; then
            case "${platforms}" in
              *[!A-Za-z0-9,/_-]*) echo "::error::platforms 含非法字符（只允许字母数字与 , / _ -）：${platforms}"; exit 1 ;;
            esac
          fi
          if [ -n "${extra_tag}" ]; then
            # OCI 标签允许 [A-Za-z0-9._-]，且首尾不能是 . 或 -
            case "${extra_tag}" in
              *[!A-Za-z0-9._-]*) echo "::error::extra_tag 含非法字符（只允许字母数字与 . _ -）：${extra_tag}"; exit 1 ;;
              .*|*.|-*|*-)       echo "::error::extra_tag 不能以 . 或 - 开头/结尾：${extra_tag}"; exit 1 ;;
            esac
            if [ "${#extra_tag}" -gt 128 ]; then echo "::error::extra_tag 过长（>128）"; exit 1; fi
          fi
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "extra_tag=${extra_tag}" >> "$GITHUB_OUTPUT"

      - name: 决定构建架构
        id: plat
        env:
          PLATFORMS: ${{ steps.inputs.outputs.platforms }}
        run: |
          if [ -n "${PLATFORMS}" ]; then
            echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          else
            # 默认只出 amd64：arm64 要 QEMU 模拟，next/umi 的构建慢好几倍还容易超时
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: contains(steps.plat.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          # ⚠️ 不加这段的话，metadata-action 会用**第一个标签**当 org.opencontainers.image.version。
          #    实测已发布的 v2026.9.2：`revision` 是对的，而 `version=latest`（因为 type=raw 里
          #    latest 排第一）。后果：任何按 image.version 判断"我装的是哪个版本"的工具都读到
          #    "latest"，包括我们自己文档里教的比版本方法。这里显式覆写成与镜像内
          #    VAN_BLOG_VERSION 完全一致的 `<tag>@<短sha>` 形状（同一个 steps.ver.outputs.version）。
          #    metadata-action 的 labels 输入是**追加/覆写**语义，不会顶掉它生成的其它 OCI 标签。
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          tags: |
            # latest：dev/dsh 的手动构建，以及任何 v* 发版标签，都指向它
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev/dsh' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev-dsh,enable=${{ github.ref == 'refs/heads/dev/dsh' }}
            type=raw,value=dev-dsh-${{ steps.ver.outputs.sha }},enable=${{ github.ref == 'refs/heads/dev/dsh' }}
            # 发版标签本身（如 v0.55.0-fork.1）
            type=raw,value=${{ steps.ver.outputs.safe_ref }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.inputs.outputs.extra_tag }},enable=${{ steps.inputs.outputs.extra_tag != '' }}

      # 把最终生效的值全打出来：构建失败时（尤其是 20-40 分钟之后才失败的那种）
      # 光看 "Build and push" 的红色叉没用，得先确认参数本身是不是对的。
      - name: 打印本次构建参数
        run: |
          echo "镜像      ：${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          echo "标签      ："
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - /'
          echo "架构      ：${{ steps.plat.outputs.platforms }}"
          echo "版本      ：${{ steps.ver.outputs.version }}"
          echo "构建参数  ：VAN_BLOG_BUILD_SERVER=http://127.0.0.1:3000"
          echo "          VAN_BLOG_NPM_REGISTRY=https://registry.npmjs.org"
          echo "          VAN_BLOG_ADMIN_BUILD_SCRIPT=build"
          echo "磁盘可用  ：$(df -h /var/lib/docker 2>/dev/null | tail -1 || df -h / | tail -1)"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub 的 runner 在海外，直连 npmjs 比走 npmmirror 快；
          # 这个值会覆盖 Dockerfile 里 npmmirror 的默认值（见 §7.25）
          build-args: |
            VAN_BLOG_VERSIONS=${{ steps.ver.outputs.version }}
            VAN_BLOG_BUILD_SERVER=http://127.0.0.1:3000
            VAN_BLOG_NPM_REGISTRY=https://registry.npmjs.org
            VAN_BLOG_ADMIN_BUILD_SCRIPT=build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 摘要
        run: |
          echo "### 已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "镜像：${{ env.REGISTRY }}/${{ steps.image.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "架构：${{ steps.plat.outputs.platforms }}" >> "$GITHUB_STEP_SUMMARY"
          echo "版本：${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⚠️ 第一次发布后记得把 package 可见性改成 **Public**：" >> "$GITHUB_STEP_SUMMARY"
          echo "> https://github.com/${{ github.repository }}/pkgs/container/vanblog → Package settings → Change visibility" >> "$GITHUB_STEP_SUMMARY"
