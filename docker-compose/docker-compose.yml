version: '3'

services:
  vanblog:
    # 本 fork 的镜像（GitHub Actions 构建发布，含本分支全部改动）
    image: ghcr.io/ckboss/vanblog:dev-dsh
    # 上游官方镜像（**不含**本分支改动）：
    # image: mereith/van-blog:latest
    # 阿里云镜像源（上游）：
    # image: registry.cn-beijing.aliyuncs.com/mereith/van-blog:latest
    restart: always
    depends_on:
      - mongo
    logging:
      # Docker 默认的 json-file 驱动会把容器 stdout **无限期**留着：
      # 博客的访问日志 + server 日志跑上几个月能吃掉几个 G，小机器会被直接写满磁盘
      # （而且是宿主机 /var/lib/docker 那个分区，跟数据卷不在一起，很多人不会想到去查）。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: 'Asia/Shanghai'
      # 邮箱地址，用于自动申请 https 证书
      EMAIL: 'someone@mereith.com'
      # 前台 /_next/static 的 CDN 前缀，未配置 CDN 时不要设置
      # VAN_BLOG_CDN_URL: 'https://cdn.example.com'
      # 本机反代时仅监听回环。默认留空（所有网卡），现有部署不用改
      # VAN_BLOG_SERVER_HOST: '127.0.0.1'
      # ── 下面这些是可选调优项，取消注释即可（./vanblog.sh config 会重新生成本文件，
      #    所以自定义项请一并写在这里，或留意脚本生成的 .bak 备份）──
      # 整站备份 / 导出归档的存放目录。默认 <日志目录>/vanblog-backups，
      # 也就是下面挂载的 vanblog_data_path/log，会随数据一起持久化。
      # VAN_BLOG_BACKUP_PATH: '/var/log/vanblog-backups'
      # 整站备份的 zstd 压缩等级（默认 19，越大越慢越小）
      # VANBLOG_BACKUP_ZSTD_LEVEL: '19'
      # 前台 ISR 增量渲染：改文章后自动重新生成页面（默认关闭，由 server 主动触发）
      # VAN_BLOG_REVALIDATE: 'true'
      # VAN_BLOG_REVALIDATE_TIME: '10'
      # 登录日志的 IP 归属地查询要请求第三方 cip.cc；不想发就设 true 关掉
      # VANBLOG_DISABLE_IP_GEO: 'true'
      # VAN_BLOG_IP_GEO_TIMEOUT: '3000'
      # caddy 按需证书的域名白名单来自站点设置；多域名/CDN 场景需要放开时设 true
      # VANBLOG_CADDY_ASK_ALLOW_ALL: 'true'
    volumes:
      # 图床文件的存放地址，按需修改。
      - ${PWD}/data/static:/app/static
      # 日志文件
      - ${PWD}/log:/var/log
      # caddy 配置存储
      - ${PWD}/caddy/config:/root/.config/caddy
      # caddy 证书存储
      - ${PWD}/caddy/data:/root/.local/share/caddy
    ports:
      # 前面的是映射到宿主机的端口号，改端口的话该前面的
      - 80:80
      - 443:443
  mongo:
    # 某些机器不支持 avx 会报错，所以默认用 v4 版本。有的话用最新的。
    # 全新部署用 7.0；如果你的数据目录是 4.4 时代建起来的，**保持 4.4.16**，
    # 直接换 tag 会让 mongod 拒绝启动（见 docker-compose-template.yml 里的说明）。
    # 老机器不支持 avx 也只能用 4.4。
    image: mongo:7.0
    restart: always
    logging:
      # Docker 默认的 json-file 驱动会把容器 stdout **无限期**留着：
      # 博客的访问日志 + server 日志跑上几个月能吃掉几个 G，小机器会被直接写满磁盘
      # （而且是宿主机 /var/lib/docker 那个分区，跟数据卷不在一起，很多人不会想到去查）。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: 'Asia/Shanghai'
    volumes:
      - ${PWD}/data/mongo:/data/db
