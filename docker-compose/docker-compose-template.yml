# ⚠️ version 是 '3.4' 而不是 '3'：mongo 的 healthcheck 用了 start_period，
# 而 docker-compose v1 对 `version: '3'`（= 文件格式 3.0）的 schema 里**没有**这个键
# （additionalProperties:false，1.25 实测直接拒绝；start_period 从 3.4 才进 schema）。
# 3.4 需要 docker-compose ≥1.16 / Docker Engine ≥17.09（2017 年后的机器都满足）；
# compose v2 会忽略 version（只打一行 obsolete 警告）。
version: '3.4'

services:
  vanblog:
    image: vanblog_image
    restart: always
    # 这个容器里同时跑着 caddy（要扛住所有客户端连接 + 到三个上游的连接）与 Node，
    # 高并发下文件描述符是第一道天花板。Docker 默认继承 daemon 的限制，
    # 但某台机器把 daemon 配成 1024 的话，几千并发就会莫名其妙 connection refused。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # start.js 收到 SIGTERM 后会给子进程 8 秒优雅退出（VAN_BLOG_SHUTDOWN_TIMEOUT_MS），
    # server 自己还要停 waline、停 website、关 mongo 连接。docker 默认只等 10 秒就 SIGKILL，
    # 余量太薄 —— 稍微慢一点的机器就会在关连接的半途被砍。给到 30 秒。
    stop_grace_period: 30s
    # ── 部署层加固 ────────────────────────────────────────────────────────────
    # 站长裁定：容器**继续以 root 运行**（本轮不改镜像、不做 su-exec/setcap）。所以这里能做的
    # 只有"收窄 root 顺手还能拿到的**额外**权限"，以及把风险如实写在文档里。
    #
    # ⚠️ 先说清它**不解决**什么：流水线功能本身就是"管理员能在容器内执行任意 JS"
    #    （provider/pipeline 把代码写进 /app/codeRunner 再 fork() 执行），所以
    #    "一个管理员会话被拿下 = 容器内 root"是产品设计的结果，不是配置能改掉的。
    #    no-new-privileges 挡的是**在此之上**再提权的路径（setuid 二进制、文件 capability），
    #    不是"防止拿到 root"。别把它当成后者的缓解。
    #
    # 为什么这一条对本项目是安全的（核实过，不是照抄最佳实践）：
    #    entrypoint.sh / scripts/start.js / Dockerfile 里 gosu、su、setpriv、setuid、newgrp
    #    **零命中**；entrypoint.sh 与 start.js 里 chown/chmod **各 0 处** ⇒ 这个容器没有任何
    #    依赖"提升权限"的启动步骤，关掉不会弄坏启动。
    # ⚠️ mongo 那个服务**故意不加**：官方 mongo 镜像的 entrypoint 在以 root 启动时会自己降权到
    #    mongodb 用户，那条路径依赖 setuid/setgid 语义，而本轮没有容器可实测 ⇒ 不动它。
    security_opt:
      - no-new-privileges:true
    # ── 下面三项是**注释形式的可选项**，本轮没有默认打开，理由逐条写在旁边 ──
    # ⚠️ 有守卫钉住"剥掉注释后这三项仍然不存在"（scripts/tests/vanblog-compose-health.test.sh），
    #    所以想打开它们的人会先撞红、读到理由，而不是"顺手加上、然后站点起不来"。
    #
    # (1) cap_drop / cap_add —— 默认**不启用**，因为本机没有容器可实测，而它的风险是真实的：
    #     容器以 root 运行、写的是**宿主属主**的 bind mount（static / log / caddy config+data /
    #     mongo 数据目录），靠的是 **CAP_DAC_OVERRIDE**。若 `cap_drop: [ALL]` 只加回
    #     NET_BIND_SERVICE，宿主目录属主不是 root 时就会**写不进去**，表现为图片上传失败、
    #     日志写不出、备份失败 —— 而且是"容器 Up、功能坏"的那种难查形状。
    #     要打开就至少加回下面这几个，并在自己的机器上把上传/备份/恢复/HTTPS 签发全跑一遍：
    # cap_drop: [ALL]
    # cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE, CHOWN, FOWNER]
    #
    # (2) read_only —— 本轮**不可行**，四个阻塞点都已核实（不是猜的）：
    #     ① entrypoint.sh 每次启动都要写 /app/caddy.json 与 /app/caddy-fallback.json
    #        （由 caddyConfig.js 生成，在**镜像层**里，不是卷）；
    #     ② 流水线要写 /app/codeRunner 与 /app/pluginRunner（config/index.ts 的默认路径，不是卷）；
    #     ③ ISR 产物写在 /app/website/packages/website/.next/server/pages/**（不是卷；
    #        实测过：渲染一篇真文章后，它的 .html/.json/.meta 三件套会出现在那里）；
    #     ④ /tmp 用于上传与整站恢复解包的临时文件。
    #     ⇒ 要做只读根，前提是先把 ②③ 变成卷、把 ① 的输出改到可写路径（那要改 entrypoint，
    #        属"改镜像"，本轮裁定不动）。
    # read_only: true
    # tmpfs: [/tmp]
    #
    # (3) pids_limit —— 防 fork 炸弹（流水线能 fork()，这是真实面）。默认不写是**版本兼容**问题：
    #     已实证 docker-compose **1.29.2** 的 schema（compose/config/compose_spec.json，
    #     additionalProperties:false）里有 pids_limit；但 **1.25** 用的是按版本分的 3.4 schema，
    #     那份文件本轮没取到（GitHub 限流），而 v2-only 的键在 3.x 下会被直接拒绝
    #     （本模板开头的 version: '3.4' 注释记的就是同一类事故）。
    #     ⇒ 只在确认自己是 compose v2、或 docker-compose ≥1.27（1.27 起忽略 version 字段、
    #        改用统一 spec）时才打开。值从 512 起步（Node + caddy + waline + 流水线子进程 +
    #        图片处理并发，正常峰值远低于此）；⚠️ 太小会让正常的图片处理/ISR 并发失败。
    # pids_limit: 512
    #
    # ⚠️ 同一类版本陷阱也适用于本模板另一处建议的 `mem_limit`（在 vanblog 服务靠后的注释里）：
    #    它同样是 compose v2 时代的键，在 docker-compose 1.25 + version 3.4 下可能被拒。
    #    打开前请先 `docker-compose config` 验一遍，别直接 `up`。
    # ⚠️ 这里以前**故意不写 healthcheck**，理由是"镜像里已经有 HEALTHCHECK 指令，编排里再写一份
    #    就是两处需要同步维护的真相"。那个理由在 **podman 下不成立**：podman/buildah 构建会
    #    **丢掉 Dockerfile 的 HEALTHCHECK 指令**，于是 podman 部署**完全没有健康探测**，而 podman 的
    #    `restart: always` 也不会因为 unhealthy 而重启 ⇒ "容器 Up 但站点坏了"没人知道。
    #    所以两处都写，并且用守卫（`scripts/tests/image-runtime.test.sh`）钉住**逐字节相同**：
    #    同步维护的成本由测试承担，而不是靠人记得。
    #    判据与镜像里那条完全一致（含"探 3001 上故意不存在的路径而不是 `/`"这个取舍，理由写在
    #    Dockerfile 的 HEALTHCHECK 注释里：探 `/` 会触发真实渲染，高峰期慢响应会被误判成坏死）。
    # ⚠️ podman 用户还需要自己加一件事：podman 不会因 unhealthy 重启容器，要
    #    `podman run --health-on-failure=restart`（或 quadlet 里 `HealthOnFailure=restart`）才会自愈。
    #    compose 的 healthcheck 只是让 `docker compose ps` / `podman ps` 能看出状态。
    # ⚠️ `start_period` 需要 compose 文件格式 ≥3.4（本文件就是 3.4，mongo 那个 healthcheck 已在用），
    #    冷启动 + 首次连 mongo 很慢，不给足会一起来就 unhealthy。
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');let n=0,bad=0;const done=()=>{if(++n===2)process.exit(bad?1:0)};const probe=(port,path,ok)=>{const r=h.get({host:'127.0.0.1',port:port,path:path,timeout:4000},res=>{res.resume();if(!ok(res.statusCode))bad=1;done()});r.on('timeout',()=>{r.destroy();bad=1;done()});r.on('error',()=>{bad=1;done()})};probe(80,'/api/public/health',s=>s<500);probe(3001,'/__vanblog_health_probe__',()=>true)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    # 容器日志的大小上限已经在下面那个 logging 块里管着了（10m × 3），
    # 事件日志另有一套按大小轮转（VANBLOG_EVENT_LOG_MAX_MB）。
    # 先起 mongo：server 连不上库会退出，容器重启几次才稳定，首次安装时看着像失败。
    # 这里**故意提交列表形式**（只保证启动顺序，不等待就绪），而不是
    # `depends_on: {mongo: {condition: service_healthy}}` 长格式，方向是这样选的：
    #   - 长格式要 docker-compose ≥1.27 或 compose v2 才解析得了（Ubuntu 20.04 自带的
    #     1.25 对 v3.x 文件里 depends_on 只认字符串列表，直接报错、整个栈起不来）——
    #     把长格式写死在模板里 = 把老机器上的**现有安装**搞坏的方向；
    #   - 列表形式在所有版本下都能解析，最坏只是"不等 mongo 就绪"（server 自己
    #     会重试连库 10×3s，见 initJwt）。
    # 所以由 ./vanblog.sh 在生成 docker-compose.yaml 时**实测本机 compose**
    # （拿一个带 condition 的最小临时文件跑 `docker-compose config`，看退出码，
    # 不猜版本号）：支持就自动升级成长格式「等 mongo 健康检查通过再起 vanblog」
    # （配合下面 mongo 的 healthcheck），不支持就保持列表形式并打印一行说明。
    depends_on:
      - mongo
    logging:
      # Docker 默认的 json-file 驱动会把容器 stdout **无限期**留着：
      # 博客的访问日志 + server 日志跑上几个月能吃掉几个 G，小机器会被直接写满磁盘
      # （而且是宿主机 /var/lib/docker 那个分区，跟数据卷不在一起，很多人不会想到去查）。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 小内存机器（1-2G）可以给两个服务各设一个上限，避免互相把对方挤到 OOM：
    # mem_limit: 768m
    environment:
      TZ: 'Asia/Shanghai'
      # 邮箱地址，用于自动申请 https 证书
      EMAIL: vanblog_email
      # 本机反代时仅监听回环。默认留空（所有网卡），现有部署不用改
      # VAN_BLOG_SERVER_HOST: '127.0.0.1'
      # ── 初始化（只有全新站点第一次启动时用得到；已初始化的站点会忽略这几项）──
      # 零接触初始化：设了下面两项，站点在开始监听第一个请求**之前**就把管理员建好，
      # "谁先请求谁就能把新站初始化成自己的"那个窗口整个消失（自动化装机推荐）。
      # VANBLOG_ADMIN_USER: 'yourname'
      # VANBLOG_ADMIN_PASSWORD: 'change-me'
      # 密码也可以放文件里（Docker secret / 挂载进来的文件），优先级高于上面那行内联的：
      # VANBLOG_ADMIN_PASSWORD_FILE: '/run/secrets/vanblog_admin_password'
      # 没做零接触初始化时，未初始化期间的两条匿名初始化接口**默认要求「初始化密钥」**：
      # 密钥每次启动重新生成，写在 <日志目录>/setup.key（0600）并在启动日志里 WARN 打印，
      # 每 10 分钟重印一次（VANBLOG_SETUP_KEY_REMIND_MINUTES 可调），初始化成功后自动删除。
      # 初始化页面会有对应的输入框。公网部署建议保持开启；显式关闭（不推荐）：
      # VANBLOG_INIT_REQUIRE_SETUP_KEY: 'false'
      # ── 下面这些是可选调优项，取消注释即可（./vanblog.sh config 会重新生成本文件，
      #    所以自定义项请一并写在这里，或留意脚本生成的 .bak 备份）──
      # 整站备份 / 导出归档的存放目录。默认 <日志目录>/vanblog-backups，
      # 也就是下面挂载的 vanblog_data_path/log，会随数据一起持久化。
      # VAN_BLOG_BACKUP_PATH: '/var/log/vanblog-backups'
      # 整站备份的 zstd 压缩等级（默认 19，越大越慢越小）
      # VANBLOG_BACKUP_ZSTD_LEVEL: '19'
      # 前台 ISR 增量渲染：改文章后自动重新生成页面（默认关闭，由 server 主动触发）
      # VAN_BLOG_REVALIDATE: 'true'
      # VAN_BLOG_REVALIDATE_TIME: '10'
      # 登录日志的 IP 归属地查询要请求第三方 cip.cc；不想发就设 true 关掉
      # VANBLOG_DISABLE_IP_GEO: 'true'
      # VAN_BLOG_IP_GEO_TIMEOUT: '3000'
      # caddy 按需证书的域名白名单来自站点设置；多域名/CDN 场景需要放开时设 true
      # VANBLOG_CADDY_ASK_ALLOW_ALL: 'true'
      # 打开 /swagger（实时 API 文档）。⚠️ 2026-09 起**默认是关的**，且只认字面 'true'
      # （打错的值不会静默打开）。默认关的理由：它等于把 111 条后台路由与登录请求的形状
      # 摊给未登录用户，还是一个匿名、此前不受限流的 59KB 响应（robots 的 disallow 不是访问控制）。
      # 后台「关于」页与「Token 管理」页会自己探测 /swagger-json：关着就改开仓库里的 API 文档
      # 并点名这个变量，所以两种状态都不会留下死链接。临时排查完建议关回去。
      # VANBLOG_SWAGGER: 'true'
      # next/image 允许优化的远程域名（逗号分隔）。默认空 = 只优化本站图片。
      # VAN_BLOG_ALLOW_DOMAINS: 'cdn.example.com'
      # libuv 线程池大小（镜像里默认 16）：sharp 的图片编解码、fs 异步操作、
      # crypto 的 scrypt 都在这个池子里，Node 默认只有 4 —— 图片站并发处理时会排队。
      # 只有在 CPU 核多、图片流量大时才值得往上调（经验值：核数的 2-4 倍）。
      # UV_THREADPOOL_SIZE: '32'
      # 上游 keep-alive 超时（毫秒，默认 65000）。**必须大于反代的空闲超时**
      # （本编排里 caddy 是 60s），否则会偶发 ECONNRESET / 502。
      # VANBLOG_KEEP_ALIVE_TIMEOUT_MS: '65000'
      # 全局限流：每 IP 每分钟请求数（默认 600）。静态资源走独立桶，
      # 默认是它的 10 倍（VANBLOG_STATIC_LIMIT_PER_MIN 可单独调）。
      # 站点在 CDN / 大 NAT 后面、访客共用少量出口 IP 时，这两个值都要往上调，
      # 否则正常读者会成片看到 429。
      # VANBLOG_RATE_LIMIT_PER_MIN: '3000'
      # VANBLOG_STATIC_LIMIT_PER_MIN: '30000'
      # ── 下面这些默认值都等于"和以前一样"，不写就是不启用 ──
      # 浏览统计的落库节奏：攒够这么多毫秒 / 这么多条就写一次库（默认 5000 / 1000）。
      # 一次落库固定 4-6 条 Mongo 命令，与攒了多少次浏览无关；调大更省库，代价是
      # 后台趋势图与 /api/public/meta 的计数最多落后一个周期。设 0 = 每次浏览立刻写。
      # VANBLOG_VIEW_FLUSH_MS: '5000'
      # VANBLOG_VIEW_FLUSH_MAX_EVENTS: '1000'
      # 访问统计保留天数。**默认 0 = 一行都不删**；最近 30 天无论怎么设都会保留。
      # 参考：本站 8767 行里，90 天的设置会删掉 6520 行（74%）。
      # VANBLOG_VISIT_RETENTION_DAYS: '365'
      # 多进程（cluster）。默认 1 = 单进程，与以前完全一致。
      # ⚠️ 打开前请自己压测：每个 worker 一份完整应用，内存近似线性增长；
      #    限流与连接池会按 worker 数摊薄（这是对的，否则阈值会被悄悄放宽 N 倍）。
      # VANBLOG_CLUSTER_WORKERS: '2'
      # picgo 第三方插件安装。**默认关闭**：picgo 1.5.6 依赖的 git-clone（命令注入）与
      # decompress（路径穿越）都没有修复版本，而插件名来自后台的一个输入框。
      # 内置的图床（本地/阿里OSS/七牛/又拍云/sm.ms/github…）都不需要插件。
      # VANBLOG_ALLOW_PICGO_PLUGINS: 'true'
      # JSON 请求体上限。全局默认 1mb（登录、公开评论、访客计数这些匿名接口不再敞着
      # 50MB 的解析上限）；后台 4 个内容前缀（文章/草稿/自定义页面/管线）保留 50mb，
      # 因为正文可以内嵌 base64 图片、整页 HTML、脚本体。
      # ⚠️ 图片上传、整站备份恢复/导入都是 multipart，不走 express.json，限额另算、未受影响。
      # VANBLOG_JSON_BODY_LIMIT: '1mb'
      # VANBLOG_JSON_BODY_LIMIT_LARGE: '50mb'
      # 请求追踪：每个响应都会回显 x-request-id（报障时报出这个 id 就能在日志里定位同一行）。
      # 超过这个毫秒数的请求会打一条 WARN 慢请求日志（0 = 关）；
      # 5xx 永远会打一条带 id 的 ERROR。访问日志默认关（每个非静态请求一行，容易刷屏）。
      # VANBLOG_SLOW_REQUEST_MS: '5000'
      # VANBLOG_ACCESS_LOG: 'true'
      # 启动时删掉 visits 上两个纯冗余的前缀索引（date_1 / pathname_1，被
      # {date,pathname} 唯一索引与 {pathname,date} 复合索引完全覆盖）。
      # 只在替代索引确实存在时才删，幂等；实测索引总量 1.18MB → 0.90MB，每次写少维护两个索引。
      # 设 false 可以保留它们（代价是白占空间 + 每次写多两次索引维护）。
      # VANBLOG_VISITS_DROP_REDUNDANT_INDEXES: 'false'
      # 限流用哪个 IP。默认 auto = 只有当"直接连到本进程的对端"是回环/私网地址时才采信转发头
      # （一体式部署里 caddy 就在同一个容器，所以按真实客户端分桶照常工作），且只信一跳：
      # 取 X-Forwarded-For 的最右一项（可信代理追加的那个）。对端是公网地址就一律用套接字地址。
      # 这堵掉的是"每个请求换一个 cf-connecting-ip / x-real-ip 就绕过全局限流"（这些头客户端可控，caddy 不剥）。
      #   always = 旧行为：始终采信 CDN 头。CDN/隧道直连源站（对端是公网代理 IP）时必须用它。
      #   never  = 只认套接字地址。⚠️ 反代后面等于全站共用一个桶，正常读者会成片 429。
      # 注意：登录防爆破、评论频率与加密文章解锁**始终**只用套接字地址，不受这个开关影响。
      # VANBLOG_TRUST_FORWARDED_HEADERS: 'auto'
      # 写库持续失败时，浏览统计在内存里最多保留多少个"按路径/按文章"的键（默认 20000 ≈ 3.2MB）。
      # 不设上限的话，Mongo 写不进去这段时间里增量只进不出（每 5 秒退回来一次），
      # 而路径名是匿名接口就能造的 ⇒ 常驻进程会稳定长内存（实测 40 万条不同路径 = +92.4MB）。
      # 超出的按"最老那天 → 文章"丢弃并打 WARN；站点级总访问量与每日快照**永不丢**。0 = 不限（旧行为）。
      # VANBLOG_VIEW_MAX_RETAINED_KEYS: '20000'
      # 事件日志（vanblog-event.log）的大小轮转：单份上限 MB × (保留份数 + 1) = 总量上界。
      # 默认 20 × 4 ≈ 80MB。⚠️ 这个文件以前**只增不减**，跑久了会吃满磁盘，
      # 而磁盘满的表现是"备份写不出来、图片存不进去、mongod 变只读"，排查时看不出根因。
      # （容器 stdout 那一份由下面的 logging.max-size 管，两套是分开的。）
      # VANBLOG_EVENT_LOG_MAX_MB: '20'
      # VANBLOG_EVENT_LOG_KEEP: '3'
      # 每篇文章保留多少个历史版本（改标题/正文时才快照；回滚前会先存一份当前状态，所以回滚可回滚）。
      # 0 = 关闭 = 旧行为。存量成本很小：实测单条均值 3.1KB，59 篇 × 10 ≈ 1.76MB。
      # VANBLOG_ARTICLE_REVISIONS_KEEP: '10'
      # 距上次"已校验的成功备份"超过这么多小时就在启动与每次失败后 WARN（0 = 关）。
      # ⚠️ 这是一条新的默认日志行：没有近期已校验备份的实例启动时会多一条 WARN（只写日志、不改行为）。
      # VANBLOG_BACKUP_STALE_WARN_HOURS: '48'
      # 阅读时长的除数（字/分钟），夹在 50–2000。私有/加密文章不给阅读时长（正文藏着，长度也就藏着）。
      # VANBLOG_READING_SPEED_WPM: '350'
      # 缩略图额外产一份 .avif 兄弟文件（比 webp 省 26–41% 字节，编码 0.6–1.3 秒/张）。
      # ⚠️ 默认关。极小图反而更大（AVIF 有约 294B 容器底噪）；**原图故意不做**（实测最高 241 秒/张 CPU）。
      # VANBLOG_THUMB_AVIF: 'false'
      # caddy 直接发 6 个固定页（/ /about /link /timeline /category /tag）的 ISR HTML，不过 Node。
      # 实测首页扫描 3.7–4.5× rps、p95 降 78–84%、单请求 / 的 p50 从 8ms 降到 1ms。
      # ⚠️ 默认关，而且**建议保持关**，除非你清楚这两条代价：
      #   1) ⚠️ 更正：早先这里写"开了就完全不受限流"，字面为真但暗示了不存在的损失 ——
      #      页面 HTML 本来就不经限流器（反代模式下 caddy → Next:3001，缓存命中不碰 Nest:3000，
      #      实测 700 个反代页面请求 0 个 429）。限流器覆盖的一直只有 /api/* 与 /static/*。
      #      直发真正改变的是"爬虫烧谁的 CPU"：Node 事件循环 → caddy sendfile。
    volumes:
      # 图床文件的存放地址，按需修改。
      - vanblog_data_path/data/static:/app/static
      # 日志文件
      - vanblog_data_path/log:/var/log
      # caddy 配置存储
      - vanblog_data_path/caddy/config:/root/.config/caddy
      # caddy 证书存储
      - vanblog_data_path/caddy/data:/root/.local/share/caddy
      # ── 流水线（自定义代码）的两个工作目录：默认**不持久化** ──
      # 服务端把流水线脚本写在 /app/codeRunner、依赖用 `pnpm add` 装到 /app/pluginRunner
      # （见 config/index.ts 的 codeRunnerPath / pluginRunnerPath）。这两个目录既不是镜像的
      # VOLUME，模板里也没挂 ⇒ **容器一重建，脚本与已装依赖全没了**，下次触发流水线时
      # 由启动时的依赖自检重新 `pnpm add` 装回来：需要能出网，且每个包最多等 300 秒。
      # ⚠️ 离线/内网部署会因此直接坏掉。要让它们跨重建存活，取消下面两行注释：
      # - vanblog_data_path/codeRunner:/app/codeRunner
      # - vanblog_data_path/pluginRunner:/app/pluginRunner
      # （首次挂载会是空目录，属正常；已有的流水线脚本需要重新在后台保存一次）
    ports:
      # 前面的是映射到宿主机的端口号，改端口的话该前面的
      - vanblog_http_port:80
      - vanblog_https_port:443
      # ⚠️ 这条是给 HTTP/3(QUIC) 用的：caddy 已经在 :443 上启用了 h1/h2/h3，
      # 但 QUIC 跑在 **UDP** 上，不映射这个端口浏览器就只能用 HTTP/2。
      # 映射了但云厂商安全组/防火墙没放行 UDP vanblog_https_port 也没关系 ——
      # caddy 照样发 Alt-Svc，浏览器试连失败会自动退回 HTTP/2，不影响访问。
      - vanblog_https_port:443/udp
  mongo:
    # mongod 干净关闭通常只要几秒，但 docker 默认只给 10 秒就 SIGKILL ——
    # 慢盘或库大一点就会在 flush 中途被杀。WiredTiger 有 journal，重启会回放，
    # 真损坏的概率不高（主要风险是宿主机断电），但多给 50 秒是免费的保险。
    stop_grace_period: 60s
    # 高并发下文件描述符是第一道天花板：每条客户端连接、每个上游连接、每个打开的文件
    # 都要一个 fd。mongod 自己也会检查（低于 64000 会打警告）。
    # Docker 默认继承 daemon 的限制（通常已经很大），但显式写出来才不会因为
    # 某台机器的 daemon 配了 1024 而在几千并发时莫名其妙 connection refused。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 内存限制（默认注释掉）。2GB 小机建议 mongo 768m + vanblog 768m：
    #   - mongo 别给到 512m 以下：WiredTiger 的缓存最小就要 256MB，再加连接与 journal 开销；
    #     真要吃紧就配 command: ["mongod","--wiredTigerCacheSizeGB","0.25"]
    #   - ⚠️ 开了 mem_limit 之后**整站备份可能被 OOM 杀**：导出用的是
    #     `zstd -19 --long=27 -T0`（多线程 + 128MB 窗口），峰值能到 1GB 上下。
    #     限制内存时请把压缩等级调低：VANBLOG_BACKUP_ZSTD_LEVEL: '12'（vanblog 服务的环境变量里设）
    # 这个 tag 由 ./vanblog.sh 在生成编排文件时填入（占位符 vanblog_mongo_image）：
    #   - **全新安装** → mongo:7.0（4.4 早在 2024-02 就 EOL 了，没有安全更新；
    #     mongoose 7.6 / driver 5.9 官方支持到 7.0，本机开发环境也是 7.0.14）
    #   - **已有数据** → 保持你现在用的那个 tag，绝不擅自改
    # ⚠️ 为什么不能随手升：数据目录与 featureCompatibilityVersion 绑定，
    #   4.4 → 8.x 没有直升路径，直接换 tag 会让 mongod 拒绝启动（容器反复重启，
    #   看起来像数据全丢）。要升级只有两条路：
    #     a) 阶梯升级 5.0 → 6.0 → 7.0，每级都要 setFCV；
    #     b) 用整站备份迁移：./vanblog.sh backup（NDJSON，跨版本可恢复）→
    #        换新 tag 起一个空库 → ./vanblog.sh restore <归档名>。
    #   某些老机器不支持 avx，跑不了 5.0+，那种情况用 VANBLOG_MONGO_IMAGE=mongo:4.4.16 指定。
    image: vanblog_mongo_image
    restart: always
    # mongo 健康检查：给 vanblog 的 `depends_on: condition: service_healthy` 用
    # （./vanblog.sh config 在本机 compose 支持时才升级成那个长格式），
    # 也让 `docker ps` 能看出 mongo 是"真的能接受连接"而不是"进程活着但还在回放 journal"。
    # ⚠️ test 必须**两个 shell 都试**：镜像 tag 是脚本填的占位符（vanblog_mongo_image），
    # 用户可能钉在 mongo:4.4.16（**没有** mongosh，命令找不到退 127 → 落到 || 后面的
    # legacy mongo），也可能用 mongo:7.0（**没有** legacy mongo shell，反之亦然）；
    # 5.0 两个都有、6.0 起只有 mongosh。ping 通了输出 1、退出码 0；连不上（还在启动/
    # 正在回放）退出码非 0 → 记一次失败，start_period 内的失败不计入 retries。
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      # Docker 默认的 json-file 驱动会把容器 stdout **无限期**留着：
      # 博客的访问日志 + server 日志跑上几个月能吃掉几个 G，小机器会被直接写满磁盘
      # （而且是宿主机 /var/lib/docker 那个分区，跟数据卷不在一起，很多人不会想到去查）。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # mem_limit: 512m
    environment:
      TZ: 'Asia/Shanghai'
    volumes:
      - vanblog_data_path/data/mongo:/data/db
