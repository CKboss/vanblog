# ⚠️ version 是 '3.4' 而不是 '3'：mongo 的 healthcheck 用了 start_period，
# 而 docker-compose v1 对 `version: '3'`（= 文件格式 3.0）的 schema 里**没有**这个键
# （additionalProperties:false，1.25 实测直接拒绝；start_period 从 3.4 才进 schema）。
# 3.4 需要 docker-compose ≥1.16 / Docker Engine ≥17.09（2017 年后的机器都满足）；
# compose v2 会忽略 version（只打一行 obsolete 警告）。
version: '3.4'

services:
  vanblog:
    image: vanblog_image
    restart: always
    # 这个容器里同时跑着 caddy（要扛住所有客户端连接 + 到三个上游的连接）与 Node，
    # 高并发下文件描述符是第一道天花板。Docker 默认继承 daemon 的限制，
    # 但某台机器把 daemon 配成 1024 的话，几千并发就会莫名其妙 connection refused。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # start.js 收到 SIGTERM 后会给子进程 8 秒优雅退出（VAN_BLOG_SHUTDOWN_TIMEOUT_MS），
    # server 自己还要停 waline、停 website、关 mongo 连接。docker 默认只等 10 秒就 SIGKILL，
    # 余量太薄 —— 稍微慢一点的机器就会在关连接的半途被砍。给到 30 秒。
    stop_grace_period: 30s
    # 先起 mongo：server 连不上库会退出，容器重启几次才稳定，首次安装时看着像失败。
    # 这里**故意提交列表形式**（只保证启动顺序，不等待就绪），而不是
    # `depends_on: {mongo: {condition: service_healthy}}` 长格式，方向是这样选的：
    #   - 长格式要 docker-compose ≥1.27 或 compose v2 才解析得了（Ubuntu 20.04 自带的
    #     1.25 对 v3.x 文件里 depends_on 只认字符串列表，直接报错、整个栈起不来）——
    #     把长格式写死在模板里 = 把老机器上的**现有安装**搞坏的方向；
    #   - 列表形式在所有版本下都能解析，最坏只是"不等 mongo 就绪"（server 自己
    #     会重试连库 10×3s，见 initJwt）。
    # 所以由 ./vanblog.sh 在生成 docker-compose.yaml 时**实测本机 compose**
    # （拿一个带 condition 的最小临时文件跑 `docker-compose config`，看退出码，
    # 不猜版本号）：支持就自动升级成长格式「等 mongo 健康检查通过再起 vanblog」
    # （配合下面 mongo 的 healthcheck），不支持就保持列表形式并打印一行说明。
    depends_on:
      - mongo
    logging:
      # Docker 默认的 json-file 驱动会把容器 stdout **无限期**留着：
      # 博客的访问日志 + server 日志跑上几个月能吃掉几个 G，小机器会被直接写满磁盘
      # （而且是宿主机 /var/lib/docker 那个分区，跟数据卷不在一起，很多人不会想到去查）。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 小内存机器（1-2G）可以给两个服务各设一个上限，避免互相把对方挤到 OOM：
    # mem_limit: 768m
    environment:
      TZ: 'Asia/Shanghai'
      # 邮箱地址，用于自动申请 https 证书
      EMAIL: vanblog_email
      # 本机反代时仅监听回环。默认留空（所有网卡），现有部署不用改
      # VAN_BLOG_SERVER_HOST: '127.0.0.1'
      # ── 下面这些是可选调优项，取消注释即可（./vanblog.sh config 会重新生成本文件，
      #    所以自定义项请一并写在这里，或留意脚本生成的 .bak 备份）──
      # 整站备份 / 导出归档的存放目录。默认 <日志目录>/vanblog-backups，
      # 也就是下面挂载的 vanblog_data_path/log，会随数据一起持久化。
      # VAN_BLOG_BACKUP_PATH: '/var/log/vanblog-backups'
      # 整站备份的 zstd 压缩等级（默认 19，越大越慢越小）
      # VANBLOG_BACKUP_ZSTD_LEVEL: '19'
      # 前台 ISR 增量渲染：改文章后自动重新生成页面（默认关闭，由 server 主动触发）
      # VAN_BLOG_REVALIDATE: 'true'
      # VAN_BLOG_REVALIDATE_TIME: '10'
      # 登录日志的 IP 归属地查询要请求第三方 cip.cc；不想发就设 true 关掉
      # VANBLOG_DISABLE_IP_GEO: 'true'
      # VAN_BLOG_IP_GEO_TIMEOUT: '3000'
      # caddy 按需证书的域名白名单来自站点设置；多域名/CDN 场景需要放开时设 true
      # VANBLOG_CADDY_ASK_ALLOW_ALL: 'true'
      # 关掉 /swagger（它默认公开，等于把整个后台 API 面摊给未登录用户；robots 的
      # disallow 不是访问控制）。⚠️ 后台「关于」页与「Token 管理」页各有一个跳 /swagger 的链接，
      # 关掉之后那两个链接会 404 —— 所以这里默认**不关**，你自己决定。
      # VANBLOG_SWAGGER: 'false'
      # next/image 允许优化的远程域名（逗号分隔）。默认空 = 只优化本站图片。
      # VAN_BLOG_ALLOW_DOMAINS: 'cdn.example.com'
      # libuv 线程池大小（镜像里默认 16）：sharp 的图片编解码、fs 异步操作、
      # crypto 的 scrypt 都在这个池子里，Node 默认只有 4 —— 图片站并发处理时会排队。
      # 只有在 CPU 核多、图片流量大时才值得往上调（经验值：核数的 2-4 倍）。
      # UV_THREADPOOL_SIZE: '32'
      # 上游 keep-alive 超时（毫秒，默认 65000）。**必须大于反代的空闲超时**
      # （本编排里 caddy 是 60s），否则会偶发 ECONNRESET / 502。
      # VANBLOG_KEEP_ALIVE_TIMEOUT_MS: '65000'
      # 全局限流：每 IP 每分钟请求数（默认 600）。静态资源走独立桶，
      # 默认是它的 10 倍（VANBLOG_STATIC_LIMIT_PER_MIN 可单独调）。
      # 站点在 CDN / 大 NAT 后面、访客共用少量出口 IP 时，这两个值都要往上调，
      # 否则正常读者会成片看到 429。
      # VANBLOG_RATE_LIMIT_PER_MIN: '3000'
      # VANBLOG_STATIC_LIMIT_PER_MIN: '30000'
      # ── 下面这些默认值都等于"和以前一样"，不写就是不启用 ──
      # 浏览统计的落库节奏：攒够这么多毫秒 / 这么多条就写一次库（默认 5000 / 1000）。
      # 一次落库固定 4-6 条 Mongo 命令，与攒了多少次浏览无关；调大更省库，代价是
      # 后台趋势图与 /api/public/meta 的计数最多落后一个周期。设 0 = 每次浏览立刻写。
      # VANBLOG_VIEW_FLUSH_MS: '5000'
      # VANBLOG_VIEW_FLUSH_MAX_EVENTS: '1000'
      # 访问统计保留天数。**默认 0 = 一行都不删**；最近 30 天无论怎么设都会保留。
      # 参考：本站 8767 行里，90 天的设置会删掉 6520 行（74%）。
      # VANBLOG_VISIT_RETENTION_DAYS: '365'
      # 多进程（cluster）。默认 1 = 单进程，与以前完全一致。
      # ⚠️ 打开前请自己压测：每个 worker 一份完整应用，内存近似线性增长；
      #    限流与连接池会按 worker 数摊薄（这是对的，否则阈值会被悄悄放宽 N 倍）。
      # VANBLOG_CLUSTER_WORKERS: '2'
      # picgo 第三方插件安装。**默认关闭**：picgo 1.5.6 依赖的 git-clone（命令注入）与
      # decompress（路径穿越）都没有修复版本，而插件名来自后台的一个输入框。
      # 内置的图床（本地/阿里OSS/七牛/又拍云/sm.ms/github…）都不需要插件。
      # VANBLOG_ALLOW_PICGO_PLUGINS: 'true'
    volumes:
      # 图床文件的存放地址，按需修改。
      - vanblog_data_path/data/static:/app/static
      # 日志文件
      - vanblog_data_path/log:/var/log
      # caddy 配置存储
      - vanblog_data_path/caddy/config:/root/.config/caddy
      # caddy 证书存储
      - vanblog_data_path/caddy/data:/root/.local/share/caddy
    ports:
      # 前面的是映射到宿主机的端口号，改端口的话该前面的
      - vanblog_http_port:80
      - vanblog_https_port:443
      # ⚠️ 这条是给 HTTP/3(QUIC) 用的：caddy 已经在 :443 上启用了 h1/h2/h3，
      # 但 QUIC 跑在 **UDP** 上，不映射这个端口浏览器就只能用 HTTP/2。
      # 映射了但云厂商安全组/防火墙没放行 UDP vanblog_https_port 也没关系 ——
      # caddy 照样发 Alt-Svc，浏览器试连失败会自动退回 HTTP/2，不影响访问。
      - vanblog_https_port:443/udp
  mongo:
    # mongod 干净关闭通常只要几秒，但 docker 默认只给 10 秒就 SIGKILL ——
    # 慢盘或库大一点就会在 flush 中途被杀。WiredTiger 有 journal，重启会回放，
    # 真损坏的概率不高（主要风险是宿主机断电），但多给 50 秒是免费的保险。
    stop_grace_period: 60s
    # 高并发下文件描述符是第一道天花板：每条客户端连接、每个上游连接、每个打开的文件
    # 都要一个 fd。mongod 自己也会检查（低于 64000 会打警告）。
    # Docker 默认继承 daemon 的限制（通常已经很大），但显式写出来才不会因为
    # 某台机器的 daemon 配了 1024 而在几千并发时莫名其妙 connection refused。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 内存限制（默认注释掉）。2GB 小机建议 mongo 768m + vanblog 768m：
    #   - mongo 别给到 512m 以下：WiredTiger 的缓存最小就要 256MB，再加连接与 journal 开销；
    #     真要吃紧就配 command: ["mongod","--wiredTigerCacheSizeGB","0.25"]
    #   - ⚠️ 开了 mem_limit 之后**整站备份可能被 OOM 杀**：导出用的是
    #     `zstd -19 --long=27 -T0`（多线程 + 128MB 窗口），峰值能到 1GB 上下。
    #     限制内存时请把压缩等级调低：VANBLOG_BACKUP_ZSTD_LEVEL: '12'（vanblog 服务的环境变量里设）
    # 这个 tag 由 ./vanblog.sh 在生成编排文件时填入（占位符 vanblog_mongo_image）：
    #   - **全新安装** → mongo:7.0（4.4 早在 2024-02 就 EOL 了，没有安全更新；
    #     mongoose 7.6 / driver 5.9 官方支持到 7.0，本机开发环境也是 7.0.14）
    #   - **已有数据** → 保持你现在用的那个 tag，绝不擅自改
    # ⚠️ 为什么不能随手升：数据目录与 featureCompatibilityVersion 绑定，
    #   4.4 → 8.x 没有直升路径，直接换 tag 会让 mongod 拒绝启动（容器反复重启，
    #   看起来像数据全丢）。要升级只有两条路：
    #     a) 阶梯升级 5.0 → 6.0 → 7.0，每级都要 setFCV；
    #     b) 用整站备份迁移：./vanblog.sh backup（NDJSON，跨版本可恢复）→
    #        换新 tag 起一个空库 → ./vanblog.sh restore <归档名>。
    #   某些老机器不支持 avx，跑不了 5.0+，那种情况用 VANBLOG_MONGO_IMAGE=mongo:4.4.16 指定。
    image: vanblog_mongo_image
    restart: always
    # mongo 健康检查：给 vanblog 的 `depends_on: condition: service_healthy` 用
    # （./vanblog.sh config 在本机 compose 支持时才升级成那个长格式），
    # 也让 `docker ps` 能看出 mongo 是"真的能接受连接"而不是"进程活着但还在回放 journal"。
    # ⚠️ test 必须**两个 shell 都试**：镜像 tag 是脚本填的占位符（vanblog_mongo_image），
    # 用户可能钉在 mongo:4.4.16（**没有** mongosh，命令找不到退 127 → 落到 || 后面的
    # legacy mongo），也可能用 mongo:7.0（**没有** legacy mongo shell，反之亦然）；
    # 5.0 两个都有、6.0 起只有 mongosh。ping 通了输出 1、退出码 0；连不上（还在启动/
    # 正在回放）退出码非 0 → 记一次失败，start_period 内的失败不计入 retries。
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      # Docker 默认的 json-file 驱动会把容器 stdout **无限期**留着：
      # 博客的访问日志 + server 日志跑上几个月能吃掉几个 G，小机器会被直接写满磁盘
      # （而且是宿主机 /var/lib/docker 那个分区，跟数据卷不在一起，很多人不会想到去查）。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # mem_limit: 512m
    environment:
      TZ: 'Asia/Shanghai'
    volumes:
      - vanblog_data_path/data/mongo:/data/db
